<mat-card class="max-w-md mx-auto my-12">
  <mat-card-content class="flex flex-col items-center gap-4 py-8 px-6 text-center">
    <h3 class="text-[var(--gold)] text-lg font-medium m-0">Connect Warcraft Logs</h3>
    <p class="text-[var(--muted)] text-sm leading-relaxed m-0">
      This tool fetches your combat data directly from Warcraft Logs.
    </p>
    <button mat-flat-button color="primary" (click)="signIn()">
      <mat-icon>login</mat-icon>
      Sign in with Warcraft Logs
    </button>
  </mat-card-content>
</mat-card>
