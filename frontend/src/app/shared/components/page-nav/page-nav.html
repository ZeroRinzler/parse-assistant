<!-- Full-width top app bar: hamburger at the top-left, branding always visible -
     the drawer/rail below it never hides the wordmark (Material's standard
     navigation-drawer layout). Toolbar background comes from mat.toolbar-overrides
     in styles.scss (a plain bg-* utility loses to Material's unlayered rule). -->
<mat-toolbar class="border-b border-[var(--border)] gap-2 shrink-0">
  <button mat-icon-button (click)="toggleNav()" aria-label="Toggle navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <a routerLink="/" class="flex items-center gap-2 no-underline text-[var(--gold)] font-bold text-[15px]" aria-label="warcraft-learner home">
    <svg class="w-6 h-6 shrink-0" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path class="fill-[var(--gold)]" d="M16 4 L27 7 L27 15.5 C27 21.5 22.5 26.5 16 29 C9.5 26.5 5 21.5 5 15.5 L5 7 Z"/>
      <g class="fill-[var(--surface)]">
        <rect x="9.5" y="18" width="3" height="4" rx="1"/>
        <rect x="14.5" y="14" width="3" height="8" rx="1"/>
        <rect x="19.5" y="10" width="3" height="12" rx="1"/>
      </g>
    </svg>
    <span>warcraft-learner</span>
  </a>
</mat-toolbar>

<mat-sidenav-container class="flex-1 min-h-0">
  <!-- Mobile: modal overlay (over) that slides in below the bar with a scrim.
       Desktop: permanent drawer that collapses to an icons-only rail via its width. -->
  <mat-sidenav class="border-r border-[var(--border)]"
               [class.nav-drawer-modal]="isMobile()"
               [class.nav-drawer-full]="!isMobile() && !railCollapsed()"
               [class.nav-drawer-rail]="railCollapsed()"
               [mode]="sidenavMode()" [opened]="sidenavOpened()"
               (openedChange)="onOpenedChange($event)">
    <div class="flex flex-col h-full py-2">
      <div class="flex-1 px-2">
        <mat-nav-list>
          <a mat-list-item routerLink="/pre" routerLinkActive #pre="routerLinkActive"
             [activated]="pre.isActive" (click)="onNavigate()"
             [matTooltip]="railCollapsed() ? 'Pre-Fight' : ''" matTooltipPosition="right">
            <mat-icon matListItemIcon>lightbulb</mat-icon>
            @if (!railCollapsed()) {
              <span matListItemTitle>Pre-Fight</span>
            }
          </a>
          <a mat-list-item routerLink="/" routerLinkActive #post="routerLinkActive"
             [routerLinkActiveOptions]="{exact:true}" [activated]="post.isActive" (click)="onNavigate()"
             [matTooltip]="railCollapsed() ? 'Analyze' : ''" matTooltipPosition="right">
            <mat-icon matListItemIcon>analytics</mat-icon>
            @if (!railCollapsed()) {
              <span matListItemTitle>Analyze</span>
            }
          </a>
        </mat-nav-list>
      </div>

      <div class="px-2 pt-1">
        <mat-nav-list>
          <a mat-list-item [href]="githubUrl" target="_blank" rel="noopener noreferrer"
             [matTooltip]="railCollapsed() ? 'View on GitHub' : ''" matTooltipPosition="right">
            <mat-icon matListItemIcon svgIcon="github"></mat-icon>
            @if (!railCollapsed()) {
              <span matListItemTitle>View on GitHub</span>
            }
          </a>
        </mat-nav-list>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="overflow-auto">
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
