<nav class="page-nav">
  <a routerLink="/" class="nav-brand" aria-label="warcraft-learner home">
    <svg class="nav-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path class="nav-brand__shield" d="M16 4 L27 7 L27 15.5 C27 21.5 22.5 26.5 16 29 C9.5 26.5 5 21.5 5 15.5 L5 7 Z"/>
      <g class="nav-brand__bars">
        <rect x="9.5" y="18" width="3" height="4" rx="1"/>
        <rect x="14.5" y="14" width="3" height="8" rx="1"/>
        <rect x="19.5" y="10" width="3" height="12" rx="1"/>
      </g>
    </svg>
    <span class="nav-brand__name">warcraft-learner</span>
  </a>

  <div class="nav-links">
    <a routerLink="/pre" routerLinkActive="active" mat-button>Pre-Fight</a>
    <a routerLink="/live" routerLinkActive="active" mat-button>Live</a>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" mat-button>Post-Raid</a>
  </div>

  <div class="nav-right">
    <a [href]="githubUrl" target="_blank" rel="noopener noreferrer" mat-icon-button
       matTooltip="View on GitHub" aria-label="GitHub repository">
      <mat-icon svgIcon="github"></mat-icon>
    </a>

    @if (auth.isLoggedIn()) {
      <button mat-button [matMenuTriggerFor]="authMenu" class="auth-btn auth-btn--connected">
        <mat-icon>account_circle</mat-icon>
        WCL
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #authMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>check_circle</mat-icon>
          <span>Signed in to Warcraft Logs</span>
        </button>
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    } @else {
      <button mat-button class="auth-btn" (click)="signIn()">
        <mat-icon>login</mat-icon>
        Sign in to WCL
      </button>
    }
  </div>
</nav>
