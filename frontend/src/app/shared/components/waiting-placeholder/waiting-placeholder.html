<div class="bg-[var(--surface)] border border-[var(--border)] rounded-[10px] overflow-hidden">
  <div class="px-4 pt-3 pb-2">
    <div class="text-[17px] font-semibold text-[var(--text)]">{{ heading() }}</div>
    @if (subtitle()) {
      <div class="text-xs text-[var(--muted)] mt-0.5">{{ subtitle() }}</div>
    }
  </div>
  <div class="border-t border-dashed border-[var(--border)] px-4 py-6 flex flex-col items-center gap-2 text-center">
    <mat-icon class="icon-seg text-[var(--muted)]">schedule</mat-icon>
    <div class="text-[13px] text-[var(--muted)]">Waiting for top parses</div>
    @if (caption()) {
      <div class="text-[11.5px] text-[var(--muted)]/70">{{ caption() }}</div>
    }
  </div>
</div>
