<div #content class="md:line-clamp-none" [class.line-clamp-2]="!expanded()"><ng-content /></div>

<!-- Rendering the toggle conditionally (vs. hiding it) avoids a display-utility clash between `hidden` and `inline-flex`. -->
@if (overflowing()) {
  <button
    type="button"
    class="md:hidden mt-1.5 inline-flex items-center gap-0.5 text-[11.5px] text-[var(--accent)]"
    [attr.aria-expanded]="expanded()"
    (click)="toggle()">
    {{ expanded() ? 'Show less' : 'Show more' }}
    <mat-icon class="icon-16">{{ expanded() ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>
}
