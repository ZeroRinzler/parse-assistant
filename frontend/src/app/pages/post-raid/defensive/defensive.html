<!-- Per-defensive findings -->
@if (findingRows().length || onPlan().length) {
  <wl-finding-table class="mt-6 block"
    title="Defensives"
    subtitle="Defensive cooldowns vs top parses."
    [rows]="findingRows()"
    [onPlan]="onPlan()"
    [showMap]="showMap()"
    (openMap)="onFindingMap($event)">
  </wl-finding-table>
}

<!-- Defensive windows: when top parsers use each defensive and how much damage they absorbed -->
@if (windows().length > 0) {
  <wl-window-comparison
    [windows]="windows()"
    [higherIsBetter]="false"
    [fightDuration]="fightDuration()"
    [showCasts]="false"
    [showMap]="showMap()"
    title="Defensive Windows"
    subtitle="Damage taken under each defensive vs top parses."
    (openMap)="onOpenMap($event)">
  </wl-window-comparison>
}
