<!-- Rotation rules -->
@if (ruleRows().length) {
  <wl-finding-table class="mt-2 block"
    title="Rotation Rules"
    subtitle="Spec rotation rules you broke during the fight."
    [rows]="ruleRows()">
  </wl-finding-table>
}

<!-- Offensive cooldowns -->
<wl-finding-table class="mt-6 block"
  title="Offensives"
  subtitle="How your offensive cooldowns compare to top parses."
  [rows]="offensiveRows()"
  [onPlan]="offensiveOnPlan()">
</wl-finding-table>

<!-- Burst windows -->
@if (data().burst_windows?.length) {
  <wl-burst-windows
    [topWindows]="data().burst_windows!"
    [playerWindows]="data().player_burst_windows || []"
    [fightDuration]="data().player_fight_duration_s || 0"
    [cdSpellIds]="data().cd_spell_ids || {}">
  </wl-burst-windows>
}

<!-- Defensives -->
@if (data().player_defensives?.length || data().top_defensive_windows?.length) {
  <wl-defensives-section
    [defensives]="data().player_defensives || []"
    [defensiveFindings]="data().defensive_findings || []"
    [topDefensiveWindows]="data().top_defensive_windows || []"
    [playerDefensiveWindows]="data().player_defensive_windows || []"
    [fightDuration]="data().player_fight_duration_s || 0">
  </wl-defensives-section>
}

<!-- Gear comparison (shown once bench gear for this encounter has loaded) -->
@if (topGear()) {
  <wl-gear-section
    [playerGear]="data().player_gear ?? null"
    [topGear]="topGear()!">
  </wl-gear-section>
}
