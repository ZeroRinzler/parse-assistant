<p class="section-label">Damage Taken</p>
<div class="dtk-section">
  <div class="dtk-header">
    @if (total() > 0) {
      <span class="dtk-total">Total: <strong>{{ total() | number }}</strong></span>
    }
    @if (outlierCount()) {
      <span class="outlier-note">{{ outlierCount() }} {{ outlierCount() === 1 ? 'source' : 'sources' }} above top-10 avg</span>
    }
  </div>

  @if (segmentRows().length) {
    <p class="dtk-subhead">Damage taken over time (30s segments)</p>
    <wl-range-chart
      [rows]="segmentRows()"
      unit="pct"
      [higherIsBetter]="false"
      [maxVal]="segMaxVal()">
    </wl-range-chart>
  }

  @if (abilityRows().length) {
    <p class="dtk-subhead">By ability</p>
    <wl-range-chart
      [rows]="abilityRows()"
      unit="pct"
      [higherIsBetter]="false"
      [maxVal]="maxVal()">
    </wl-range-chart>
  }
</div>
