<!-- Per-defensive findings -->
@if (defRows().length || defOnPlan().length) {
  <wl-finding-table class="mt-6 block"
    title="Defensives"
    subtitle="How your defensive cooldowns compare to top parses."
    [rows]="defRows()"
    [onPlan]="defOnPlan()">
  </wl-finding-table>
}

<!-- Defensive windows: when top parsers use each defensive and how much damage they absorbed -->
@if (defWindows().length > 0) {
  <p class="mt-6 text-xl font-medium">Defensive Windows</p>
  <p class="text-sm text-[var(--muted)]">Each bar is the damage taken while the defensive was active, as a share of your total damage taken this fight - lower is better.</p>
  <wl-window-comparison [windows]="defWindows()" [higherIsBetter]="false" [fightDuration]="fightDuration()"
    [showCasts]="false" [showMap]="showMap()" (openMap)="onOpenMap($event)"></wl-window-comparison>
}
