@if (!isLoggedIn()) {
  <wl-auth-banner></wl-auth-banner>
} @else {
  <div class="container">
    <mat-card class="input-card">
      <div class="input-row">
        <mat-form-field appearance="outline" class="flex-1">
          <mat-label>Report URL or Code</mat-label>
          <input matInput [formControl]="reportControl" placeholder="https://www.warcraftlogs.com/reports/…"
                 (keydown.enter)="startLive()" />
        </mat-form-field>
        <button mat-flat-button color="primary" (click)="startLive()">Watch</button>
        <button mat-stroked-button (click)="stopLive()">Stop</button>
      </div>
    </mat-card>

    @if (error()) {
      <div class="error-msg">⚠ {{ error() }}</div>
    }

    @if (status()) {
      <div class="status-msg">{{ status() }}</div>
    }

    @if (loading()) {
      <wl-loading-spinner [message]="status() || 'Analyzing…'"></wl-loading-spinner>
    }

    @if (result() && !loading()) {
      <mat-card class="result-card">
        <wl-analysis-result [data]="result()!"></wl-analysis-result>
      </mat-card>
    }
  </div>
}
