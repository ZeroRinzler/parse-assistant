<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WCL Login…</title>
  <style>
    body{background:#0a0c10;color:#dde1ec;font-family:'Segoe UI',sans-serif;
         display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{text-align:center}
    .spinner{width:32px;height:32px;border:3px solid #2a2f3d;border-top-color:#c8a64f;
             border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    p{color:#7b82a0;font-size:14px;margin:0}
    .err{color:#e05252}
  </style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Completing WCL login…</p>
</div>
<script>
(async () => {
  const p          = new URLSearchParams(location.search);
  const code       = p.get('code');
  const returnPath = sessionStorage.getItem('wcl_return_path') || 'live.html';
  const msgEl      = document.getElementById('msg');

  if (!code) {
    msgEl.textContent = 'Login cancelled.';
    setTimeout(() => location.replace(returnPath), 1500);
    return;
  }

  // Load wcl.js, then exchange the code for a token.
  await new Promise((res, rej) => {
    const s   = document.createElement('script');
    s.src     = 'wcl.js';
    s.onload  = res;
    s.onerror = () => rej(new Error('Failed to load wcl.js'));
    document.head.appendChild(s);
  });

  try {
    await wclExchangeCode(code);
    location.replace(returnPath);
  } catch (e) {
    msgEl.className = 'err';
    msgEl.textContent = `Login failed: ${e.message}`;
  }
})();
</script>
</body>
</html>
