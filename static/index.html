<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post-Raid — WoW Analyzer</title>
  <link rel="stylesheet" href="renderer.css" />
  <style>
    :root {
      --bg:#0a0c10; --surface:#13161e; --surface2:#1c202c; --border:#2a2f3d;
      --gold:#c8a64f; --gold-light:#e8c86a; --text:#dde1ec; --muted:#7b82a0;
      --critical:#e05252; --warning:#e8a93a; --info:#5b8de8; --success:#4caf7a;
      --radius:8px;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; line-height:1.6; min-height:100vh; }

    .page-nav{ background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:4px; padding:8px 16px; position:relative; }
    .page-nav a{ color:var(--muted); text-decoration:none; padding:6px 18px; border-radius:6px; font-size:13px; font-weight:600; }
    .page-nav a:hover{ background:var(--surface2); color:var(--text); }
    .page-nav a.active{ background:var(--surface2); color:var(--gold); }
    .nav-char{ position:absolute; right:16px; }

    .container{ max-width:860px; margin:0 auto; padding:32px 20px 64px; }

    .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }

    .form-group{ margin-bottom:14px; }
    label{ display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
    input, select{ width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:9px 12px; font-size:14px; outline:none; transition:border-color .15s; }
    input:focus, select:focus{ border-color:var(--gold); }
    select option{ background:var(--surface2); }

    .selectors{ margin-top:16px; border-top:1px solid var(--border); padding-top:16px; }
    .row{ display:flex; gap:14px; }
    .row .form-group{ flex:1; }
    .hidden{ display:none!important; }

    .loading-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:48px; color:var(--muted); }
    .spinner{ width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .error-msg{ background:rgba(224,82,82,0.1); border:1px solid rgba(224,82,82,0.3); border-radius:var(--radius); padding:14px 16px; color:var(--critical); font-size:13px; margin-bottom:16px; }
  </style>
</head>
<body>
<nav class="page-nav">
  <a href="pre.html">Pre-Fight</a>
  <a href="live.html">Live</a>
  <a href="index.html" class="active">Post-Raid</a>
  <div class="nav-char"><div id="char-chip" class="char-chip"></div></div>
</nav>

<!-- Character selection modal -->
<div id="char-modal" class="char-modal-overlay hidden">
  <div class="char-modal-box">
    <h3>Who are you?</h3>
    <p>Paste your Warcraft Logs character URL and your name will be auto-selected in every log you open.</p>
    <div class="char-modal-row">
      <input id="char-modal-input" type="text"
        placeholder="https://www.warcraftlogs.com/character/eu/server/name"
        onkeydown="if(event.key==='Enter') closeCharModal(true)" />
      <button class="char-modal-btn" onclick="closeCharModal(true)">Save</button>
    </div>
    <div id="char-modal-status" class="char-modal-status"></div>
    <span class="char-modal-skip" onclick="closeCharModal(false)">Skip for now</span>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="form-group">
      <label for="report-url">Warcraft Logs Report URL or Code</label>
      <input id="report-url" type="text"
        placeholder="https://www.warcraftlogs.com/reports/AbCdEfGh..."
        oninput="onReportInput()"
        onkeydown="if(event.key==='Enter'){ clearTimeout(_loadTimer); loadReport(); }" />
    </div>
    <div id="selectors" class="selectors hidden">
      <div id="char-not-found" class="char-not-found hidden"></div>
      <div class="row">
        <div class="form-group">
          <label for="fight-select">Fight</label>
          <select id="fight-select" onchange="filterAndPopulatePlayers(); analyzePlayer()"></select>
        </div>
        <div class="form-group" id="player-select-group">
          <label for="player-select">Player</label>
          <select id="player-select" onchange="analyzePlayer()"></select>
        </div>
      </div>
    </div>
  </div>

  <div id="loading" class="hidden">
    <div class="loading-wrap"><div class="spinner"></div><span>Fetching combat log…</span></div>
  </div>
  <div id="error-box" class="error-msg hidden"></div>
  <div id="results" class="card hidden"></div>
</div>

<script src="renderer.js"></script>
<script>
  let reportCode = '';
  let _loadTimer = null;
  let _allPlayers = [];
  let _allFights  = [];

  function onReportInput() {
    clearTimeout(_loadTimer);
    _loadTimer = setTimeout(() => loadReport(), 400);
  }

  function syncURL() {
    const p = new URLSearchParams();
    if (reportCode) p.set('report', reportCode);
    const fight  = document.getElementById('fight-select')?.value;
    const player = document.getElementById('player-select')?.value;
    if (fight)  p.set('fight', fight);
    if (player) p.set('player', player);
    history.replaceState({}, '', p.toString() ? `?${p}` : location.pathname);
  }

  window.onload = () => {
    renderCharChip();
    // First-time visitor prompt
    if (!getSavedChar()) promptChangeChar();

    const p = new URLSearchParams(location.search);
    const r = p.get('report');
    if (r) {
      document.getElementById('report-url').value = r;
      loadReport(p.get('fight'), p.get('player'));
    }
  };

  async function loadReport(autoFight = null, autoPlayer = null) {
    clearError();
    const url = document.getElementById('report-url').value.trim();
    if (!url) return;
    reportCode = extractCode(url);
    try {
      const resp = await fetch(`/api/report/${reportCode}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Failed to load report');
      _allFights  = data.fights;
      _allPlayers = data.players;
      populateFights(data.fights, autoFight);
      filterAndPopulatePlayers();
      applyCharacterSelection(autoPlayer);
      document.getElementById('selectors').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      syncURL();
      analyzePlayer();
    } catch (err) { showError(err.message); }
  }

  async function analyzePlayer() {
    clearError();
    const fightId  = parseInt(document.getElementById('fight-select').value, 10);
    const playerId = parseInt(document.getElementById('player-select').value, 10);
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('results').classList.add('hidden');
    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ report_url: reportCode, fight_id: fightId, player_id: playerId }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Analysis failed');
      renderResults(data);
      syncURL();
    } catch (err) { showError(err.message); }
    finally { document.getElementById('loading').classList.add('hidden'); }
  }
</script>
</body>
</html>
