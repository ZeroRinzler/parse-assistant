<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW Progression Analyzer</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #13161e;
      --surface2: #1c202c;
      --border: #2a2f3d;
      --gold: #c8a64f;
      --gold-light: #e8c86a;
      --text: #dde1ec;
      --muted: #7b82a0;
      --critical: #e05252;
      --warning: #e8a93a;
      --info: #5b8de8;
      --success: #4caf7a;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    select option { background: var(--surface2); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #9a6f1f, var(--gold));
      color: #0a0c10;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.3px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    .selectors { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }

    .row { display: flex; gap: 14px; }
    .row .form-group { flex: 1; }

    .hidden { display: none !important; }

    /* Loading */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 48px;
      color: var(--muted);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .result-header {
      margin-bottom: 20px;
    }

    .result-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
    }

    .findings { display: flex; flex-direction: column; gap: 12px; }

    .finding {
      background: var(--surface2);
      border-radius: var(--radius);
      border-left: 4px solid var(--border);
      padding: 14px 16px;
    }

    .finding.finding-critical { border-left-color: var(--critical); }
    .finding.finding-warning  { border-left-color: var(--warning); }
    .finding.finding-info     { border-left-color: var(--info); }
    .finding.finding-success  { border-left-color: var(--success); }

    .finding-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .severity-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .severity-critical { background: rgba(224,82,82,0.18); color: var(--critical); }
    .severity-warning  { background: rgba(232,169,58,0.18); color: var(--warning); }
    .severity-info     { background: rgba(91,141,232,0.18); color: var(--info); }
    .severity-success  { background: rgba(76,175,122,0.18); color: var(--success); }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin: 20px 0 10px;
    }
    .section-label:first-child { margin-top: 0; }

    .timestamp {
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .category {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .finding-message {
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.55;
    }

    .no-findings {
      background: rgba(76,175,122,0.1);
      border: 1px solid rgba(76,175,122,0.3);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      color: var(--success);
      font-weight: 600;
    }

    .error-msg {
      background: rgba(224,82,82,0.1);
      border: 1px solid rgba(224,82,82,0.3);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--critical);
      font-size: 13px;
    }

    /* Parse comparison table */
    .comparison-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-top: 16px;
    }

    .comparison-card h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .cmp-table th {
      text-align: left;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    .cmp-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(42,47,61,0.5);
      color: var(--text);
    }

    .cmp-table tr:last-child td { border-bottom: none; }

    .cmp-table td.cd-name { font-weight: 600; color: var(--gold-light); }

    .delta-good { color: var(--success); font-weight: 700; }
    .delta-bad  { color: var(--critical); font-weight: 700; }
    .delta-ok   { color: var(--muted); }

    .finding-remedy {
      color: var(--gold-light);
      font-size: 12.5px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-style: italic;
    }

    .finding-remedy::before {
      content: '→ ';
      font-style: normal;
      font-weight: 700;
      color: var(--gold);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>Load Report</h2>
    <div class="form-group">
      <label for="report-url">Warcraft Logs Report URL or Code</label>
      <input id="report-url" type="text"
        placeholder="https://www.warcraftlogs.com/reports/AbCdEfGh..."
        onkeydown="if(event.key==='Enter') loadReport()" />
    </div>
    <button class="btn" id="load-btn" onclick="loadReport()">Load Report</button>

    <div id="selectors" class="selectors hidden">
      <div class="row">
        <div class="form-group">
          <label for="fight-select">Fight</label>
          <select id="fight-select" onchange="syncURL()"></select>
        </div>
        <div class="form-group">
          <label for="player-select">Player</label>
          <select id="player-select" onchange="syncURL()"></select>
        </div>
      </div>
      <button class="btn" id="analyze-btn" onclick="analyzePlayer()">Analyze Pull</button>
    </div>
  </div>

  <div id="loading" class="hidden">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <span>Fetching combat log from Warcraft Logs…</span>
    </div>
  </div>

  <div id="error-box" class="error-msg hidden"></div>

  <div id="results" class="card hidden"></div>
</div>

<script>
  let reportCode = '';

  // ── URL persistence ──────────────────────────────────────────────────────────
  function syncURL() {
    const params = new URLSearchParams();
    if (reportCode) params.set('report', reportCode);
    const fight = document.getElementById('fight-select')?.value;
    if (fight) params.set('fight', fight);
    const player = document.getElementById('player-select')?.value;
    if (player) params.set('player', player);
    history.replaceState({}, '', params.toString() ? `?${params}` : location.pathname);
  }

  window.onload = () => {
    const p = new URLSearchParams(location.search);
    const r = p.get('report');
    if (r) {
      document.getElementById('report-url').value = r;
      loadReport(p.get('fight'), p.get('player'));
    }
  };

  function extractCode(url) {
    const m = url.match(/\/reports\/([a-zA-Z0-9]+)/);
    return m ? m[1] : url.trim();
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function formatMs(ms) { return formatDuration(ms / 1000); }

  function formatSpec(spec) {
    // "RetributionPaladin" → "Retribution Paladin"
    return spec.replace(/([A-Z])/g, ' $1').trim();
  }

  function categoryLabel(cat) {
    return {
      cooldown_alignment: 'Alignment',
      lost_cooldown:      'Lost Cast',
      cooldown_delay:     'Delay',
      cast_efficiency:    'Downtime',
      unsupported_spec:   'Spec Note',
      rule_violation:     'Rule',
      cooldown_usage:     'On Track',
    }[cat] || cat;
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = `⚠ ${msg}`;
    el.classList.remove('hidden');
  }

  function clearError() {
    document.getElementById('error-box').classList.add('hidden');
  }

  async function loadReport(autoFight = null, autoPlayer = null) {
    clearError();
    const url = document.getElementById('report-url').value.trim();
    if (!url) return;

    reportCode = extractCode(url);
    const btn = document.getElementById('load-btn');
    btn.textContent = 'Loading…';
    btn.disabled = true;

    try {
      const resp = await fetch(`/api/report/${reportCode}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Failed to load report');

      populateFights(data.fights, autoFight);
      populatePlayers(data.players, autoPlayer);
      document.getElementById('selectors').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      syncURL();
      if (autoFight && autoPlayer) analyzePlayer();
    } catch (err) {
      showError(err.message);
    } finally {
      btn.textContent = 'Load Report';
      btn.disabled = false;
    }
  }

  function populateFights(fights, autoFight = null) {
    const sel = document.getElementById('fight-select');
    sel.innerHTML = '';
    fights.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id;
      const status = f.kill ? '✓ Kill' : '✗ Wipe';
      opt.textContent = `${f.name} [${status}] ${formatDuration(f.duration_s)}`;
      sel.appendChild(opt);
    });
    sel.value = autoFight ?? (fights.length ? fights[fights.length - 1].id : '');
  }

  function populatePlayers(players, autoPlayer = null) {
    const sel = document.getElementById('player-select');
    sel.innerHTML = '';
    players.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.name} — ${formatSpec(p.spec)}`;
      sel.appendChild(opt);
    });
    if (autoPlayer) sel.value = autoPlayer;
  }

  async function analyzePlayer() {
    clearError();
    const fightId  = parseInt(document.getElementById('fight-select').value, 10);
    const playerId = parseInt(document.getElementById('player-select').value, 10);

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('results').classList.add('hidden');

    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ report_url: reportCode, fight_id: fightId, player_id: playerId }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Analysis failed');
      renderResults(data);
    } catch (err) {
      showError(err.message);
    } finally {
      document.getElementById('loading').classList.add('hidden');
      btn.disabled = false;
    }
  }

  function renderResults(data) {
    const el = document.getElementById('results');

    const improvements = data.findings.filter(f => f.severity === 'critical' || f.severity === 'warning');
    const successes    = data.findings.filter(f => f.severity === 'success');
    const info         = data.findings.filter(f => f.severity === 'info');

    let findingsHtml = '';
    if (info.length)
      findingsHtml += `<div class="findings">${info.map(renderFinding).join('')}</div>`;
    if (improvements.length)
      findingsHtml += `<p class="section-label">Needs Improvement</p><div class="findings">${improvements.map(renderFinding).join('')}</div>`;
    if (successes.length)
      findingsHtml += `<p class="section-label">Doing Well</p><div class="findings">${successes.map(renderFinding).join('')}</div>`;
    if (!findingsHtml)
      findingsHtml = '<div class="no-findings">✓ No significant issues detected. Strong performance!</div>';

    const compHtml = renderComparison(data.parse_comparison);

    el.innerHTML = `
      <div class="result-header">
        <h2>${data.player} — ${formatSpec(data.spec)}</h2>
      </div>
      ${findingsHtml}
      ${compHtml}
    `;

    el.classList.remove('hidden');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderComparison(cmp) {
    if (!cmp || cmp.length === 0) return '';

    const sampleCount = cmp[0]?.sample_count ?? 0;

    const rows = cmp.map(c => {
      // Prefer uses-per-minute for fair kill-time comparison; fall back to raw count diff
      const playerUpm = c.player_uses_per_min ?? null;
      const topUpm    = c.top_avg_uses_per_min ?? null;
      const upmDiff   = (playerUpm !== null && topUpm !== null) ? playerUpm - topUpm : null;

      const firstDiff = (c.top_avg_first_cast_s !== null && c.player_first_cast_s !== null)
        ? c.player_first_cast_s - c.top_avg_first_cast_s : null;

      // Use per-CD σ from top parses as the good/bad boundary.
      // Player is green if within 1σ of the top-parse average; red if further away.
      // Falls back to flat constants when σ is not yet available (no parse samples).
      const upmBand = (c.top_stddev_uses_per_min != null) ? c.top_stddev_uses_per_min : 0.05;
      const usesClass = upmDiff === null ? 'delta-ok'
        : upmDiff >= -upmBand ? 'delta-good' : 'delta-bad';
      const firstBand = (c.top_stddev_first_cast_s != null) ? c.top_stddev_first_cast_s : 3;
      const firstClass = firstDiff === null ? 'delta-ok'
        : firstDiff <= firstBand ? 'delta-good' : 'delta-bad';

      const upmDelta = upmDiff !== null
        ? `<span class="${usesClass}">${upmDiff >= 0 ? '+' : ''}${upmDiff.toFixed(2)}</span>` : '—';
      const firstDelta = firstDiff !== null
        ? `<span class="${firstClass}">${firstDiff >= 0 ? '+' : ''}${firstDiff.toFixed(1)}s</span>` : '—';

      const playerUsesCell = playerUpm !== null
        ? `${c.player_uses} <small class="delta-ok">(${playerUpm}/min)</small>`
        : c.player_uses;
      const topUsesCell = topUpm !== null
        ? `${c.top_avg_uses ?? '—'} avg <small class="delta-ok">(${topUpm}/min)</small>`
        : `${c.top_avg_uses ?? '—'} avg`;

      const playerFirst = c.player_first_cast_s !== null ? `${c.player_first_cast_s}s` : '—';
      const topFirst = c.top_avg_first_cast_s !== null ? `${c.top_avg_first_cast_s}s` : '—';

      // BL column: alignment rate + offset comparison when top-parse offset data is available
      const fmtOff = v => `${v >= 0 ? '+' : ''}${v.toFixed(1)}s`;
      let blCell = c.top_bl_pct !== null
        ? `<span class="${c.top_bl_pct >= 80 ? 'delta-good' : 'delta-ok'}">${c.top_bl_pct}% aligned</span>`
        : '—';
      if (c.top_avg_bl_offset_s != null) {
        const topOffStr = fmtOff(c.top_avg_bl_offset_s);
        const sdStr = c.top_stddev_bl_offset_s != null ? ` ±${c.top_stddev_bl_offset_s.toFixed(1)}s` : '';
        if (c.player_bl_offset_s != null) {
          const band = c.top_stddev_bl_offset_s != null ? 2 * c.top_stddev_bl_offset_s : 5;
          const offsetDiff = Math.abs(c.player_bl_offset_s - c.top_avg_bl_offset_s);
          const offsetClass = offsetDiff <= band ? 'delta-good' : 'delta-bad';
          blCell += `<br><small>BL timing: <span class="${offsetClass}">${fmtOff(c.player_bl_offset_s)}</span>`
                  + ` / top avg ${topOffStr}${sdStr}</small>`;
        } else {
          blCell += `<br><small>Top BL timing: ${topOffStr}${sdStr}</small>`;
        }
      }

      return `<tr>
        <td class="cd-name">${c.name}</td>
        <td>${playerUsesCell} <small class="delta-ok">/ ${topUsesCell}</small> ${upmDelta}</td>
        <td>${playerFirst} <small class="delta-ok">/ ${topFirst} avg</small> ${firstDelta}</td>
        <td>${blCell}</td>
      </tr>`;
    }).join('');

    return `
      <div class="comparison-card">
        <h3>vs Top ${sampleCount} Parses — uses/min normalized for kill time</h3>
        <table class="cmp-table">
          <thead>
            <tr>
              <th>Cooldown</th>
              <th>Uses (you / top avg)</th>
              <th>First Cast (you / top avg)</th>
              <th>BL-Aligned (top %)</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderFinding(f) {
    const ts = f.timestamp_ms != null
      ? `<span class="timestamp">${formatMs(f.timestamp_ms)}</span>` : '';
    const remedy = f.details?.remedy
      ? `<p class="finding-remedy">${f.details.remedy}</p>` : '';

    return `
      <div class="finding finding-${f.severity}">
        <div class="finding-header">
          <span class="severity-badge severity-${f.severity}">${f.severity.toUpperCase()}</span>
          ${ts}
          <span class="category">${categoryLabel(f.category)}</span>
        </div>
        <p class="finding-message">${f.message}</p>
        ${remedy}
      </div>
    `;
  }
</script>
</body>
</html>
