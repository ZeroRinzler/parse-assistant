<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW Progression Analyzer</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #13161e;
      --surface2: #1c202c;
      --border: #2a2f3d;
      --gold: #c8a64f;
      --gold-light: #e8c86a;
      --text: #dde1ec;
      --muted: #7b82a0;
      --critical: #e05252;
      --warning: #e8a93a;
      --info: #5b8de8;
      --success: #4caf7a;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    select option { background: var(--surface2); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #9a6f1f, var(--gold));
      color: #0a0c10;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.3px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    .selectors { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }

    .row { display: flex; gap: 14px; }
    .row .form-group { flex: 1; }

    .hidden { display: none !important; }

    /* Loading */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 48px;
      color: var(--muted);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .result-header { margin-bottom: 18px; }
    .result-header h2 { font-size: 18px; font-weight: 700; color: var(--gold); }

    .error-msg {
      background: rgba(224,82,82,0.1);
      border: 1px solid rgba(224,82,82,0.3);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--critical);
      font-size: 13px;
    }

    /* CD-centric cards */
    .cd-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }

    .cd-card {
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .cd-card.has-issue  { border-color: rgba(232,169,58,0.35); }
    .cd-card.has-critical { border-color: rgba(224,82,82,0.45); }

    .cd-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: default;
    }
    .cd-card.has-issue .cd-card-header,
    .cd-card.has-critical .cd-card-header { cursor: pointer; }
    .cd-card.has-issue .cd-card-header:hover,
    .cd-card.has-critical .cd-card-header:hover { background: rgba(255,255,255,0.02); }

    .cd-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--success);
    }
    .cd-card.has-issue   .cd-dot { background: var(--warning); }
    .cd-card.has-critical .cd-dot { background: var(--critical); }

    .cd-name { font-weight: 600; font-size: 13.5px; color: var(--text); flex: 1; }

    .cd-meta { font-size: 12px; color: var(--muted); }
    .cd-meta .bad  { color: var(--critical); font-weight: 600; }
    .cd-meta .warn { color: var(--warning); font-weight: 600; }

    .cd-chevron { color: var(--muted); font-size: 11px; transition: transform .15s; }
    .cd-card.open .cd-chevron { transform: rotate(90deg); }

    .cd-card-body {
      display: none;
      padding: 0 14px 12px;
      border-top: 1px solid rgba(42,47,61,0.6);
    }
    .cd-card.open .cd-card-body { display: block; }

    .cd-issue {
      padding: 9px 0 4px;
    }
    .cd-issue + .cd-issue { border-top: 1px solid rgba(42,47,61,0.5); padding-top: 9px; }

    .cd-issue-msg { font-size: 13px; color: var(--text); line-height: 1.5; }
    .cd-issue-ts  { font-family: monospace; font-size: 11px; color: var(--muted);
                    background: var(--surface); padding: 1px 5px; border-radius: 3px;
                    margin-right: 6px; }
    .cd-remedy {
      font-size: 12px; color: var(--gold-light); font-style: italic;
      margin-top: 5px;
    }
    .cd-remedy::before { content: '→ '; font-style: normal; font-weight: 700; color: var(--gold); }

    /* Rotation rules (non-CD findings) */
    .rule-list { display: flex; flex-direction: column; gap: 6px; }
    .rule-item {
      background: var(--surface2);
      border-radius: 6px;
      border-left: 3px solid var(--critical);
      padding: 9px 13px;
    }
    .rule-item.sev-warning { border-left-color: var(--warning); }
    .rule-item-msg { font-size: 13px; color: var(--text); line-height: 1.5; }
    .rule-item-ts  { font-family: monospace; font-size: 11px; color: var(--muted);
                     background: var(--surface); padding: 1px 5px; border-radius: 3px;
                     margin-right: 6px; }
    .rule-remedy {
      font-size: 12px; color: var(--gold-light); font-style: italic; margin-top: 5px;
    }
    .rule-remedy::before { content: '→ '; font-style: normal; font-weight: 700; color: var(--gold); }

    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin: 16px 0 8px;
    }
    .section-label:first-child { margin-top: 0; }

    .no-findings {
      background: rgba(76,175,122,0.07);
      border: 1px solid rgba(76,175,122,0.25);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      color: var(--success);
      font-weight: 600;
      font-size: 13px;
    }


    .delta-good { color: var(--success); font-weight: 700; }
    .delta-bad  { color: var(--critical); font-weight: 700; }
    .delta-ok   { color: var(--muted); }

    .page-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:4px;padding:8px 16px}
    .page-nav a{color:var(--muted);text-decoration:none;padding:6px 18px;border-radius:6px;font-size:13px;font-weight:600}
    .page-nav a:hover{background:var(--surface2);color:var(--text)}
    .page-nav a.active{background:var(--surface2);color:var(--gold)}
  </style>
</head>
<body>
<nav class="page-nav">
  <a href="/pre">Pre-Fight</a>
  <a href="/live">Live</a>
  <a href="/" class="active">Post-Raid</a>
</nav>
<div class="container">
  <div class="card">
    <div class="form-group">
      <label for="report-url">Warcraft Logs Report URL or Code</label>
      <input id="report-url" type="text"
        placeholder="https://www.warcraftlogs.com/reports/AbCdEfGh..."
        oninput="onReportInput()"
        onkeydown="if(event.key==='Enter'){ clearTimeout(_loadTimer); loadReport(); }" />
    </div>

    <div id="selectors" class="selectors hidden">
      <div class="row">
        <div class="form-group">
          <label for="fight-select">Fight</label>
          <select id="fight-select" onchange="filterAndPopulatePlayers(); analyzePlayer()"></select>
        </div>
        <div class="form-group">
          <label for="player-select">Player</label>
          <select id="player-select" onchange="analyzePlayer()"></select>
        </div>
      </div>
    </div>
  </div>

  <div id="loading" class="hidden">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <span>Fetching combat log from Warcraft Logs…</span>
    </div>
  </div>

  <div id="error-box" class="error-msg hidden"></div>

  <div id="results" class="card hidden"></div>
</div>

<script>
  let reportCode = '';
  let _loadTimer = null;
  let _allPlayers = [];   // all actors from report
  let _allFights  = [];   // fights with friendlyPlayers

  function onReportInput() {
    clearTimeout(_loadTimer);
    _loadTimer = setTimeout(() => loadReport(), 400);
  }

  // ── URL persistence ──────────────────────────────────────────────────────────
  function syncURL() {
    const params = new URLSearchParams();
    if (reportCode) params.set('report', reportCode);
    const fight = document.getElementById('fight-select')?.value;
    if (fight) params.set('fight', fight);
    const player = document.getElementById('player-select')?.value;
    if (player) params.set('player', player);
    history.replaceState({}, '', params.toString() ? `?${params}` : location.pathname);
  }

  window.onload = () => {
    const p = new URLSearchParams(location.search);
    const r = p.get('report');
    if (r) {
      document.getElementById('report-url').value = r;
      loadReport(p.get('fight'), p.get('player'));
    }
  };

  function extractCode(url) {
    const m = url.match(/\/reports\/([a-zA-Z0-9]+)/);
    return m ? m[1] : url.trim();
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function formatMs(ms) { return formatDuration(ms / 1000); }

  function formatSpec(spec) {
    // "RetributionPaladin" → "Retribution Paladin"
    return spec.replace(/([A-Z])/g, ' $1').trim();
  }

  function categoryLabel(cat) {
    return {
      cooldown_alignment: 'Alignment',
      lost_cooldown:      'Lost Cast',
      cooldown_delay:     'Delay',
      cast_efficiency:    'Downtime',
      unsupported_spec:   'Spec Note',
      rule_violation:     'Rule',
      cooldown_usage:     'On Track',
      hold_suggestion:    'Timing Tip',
    }[cat] || cat;
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = `⚠ ${msg}`;
    el.classList.remove('hidden');
  }

  function clearError() {
    document.getElementById('error-box').classList.add('hidden');
  }

  async function loadReport(autoFight = null, autoPlayer = null) {
    clearError();
    const url = document.getElementById('report-url').value.trim();
    if (!url) return;

    reportCode = extractCode(url);

    try {
      const resp = await fetch(`/api/report/${reportCode}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Failed to load report');

      _allFights  = data.fights;
      _allPlayers = data.players;
      populateFights(data.fights, autoFight);
      filterAndPopulatePlayers(autoPlayer);
      document.getElementById('selectors').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      syncURL();
      analyzePlayer();
    } catch (err) {
      showError(err.message);
    }
  }

  function populateFights(fights, autoFight = null) {
    const sel = document.getElementById('fight-select');
    sel.innerHTML = '';
    fights.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id;
      const status = f.kill ? '✓' : `✗ #${f.attempt}`;
      opt.textContent = `${f.name} [${status}] ${formatDuration(f.duration_s)}`;
      sel.appendChild(opt);
    });
    sel.value = autoFight ?? (fights.length ? fights[fights.length - 1].id : '');
  }

  function filterAndPopulatePlayers(autoPlayer = null) {
    const fightId = parseInt(document.getElementById('fight-select').value, 10);
    const fight = _allFights.find(f => f.id === fightId);
    const fp = fight?.friendlyPlayers;
    // If WCL returned friendlyPlayers, limit to those; otherwise show all
    const visible = (fp && fp.length > 0)
      ? _allPlayers.filter(p => fp.includes(p.id))
      : _allPlayers;
    const sel = document.getElementById('player-select');
    const prev = sel.value;
    sel.innerHTML = '';
    visible.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.name} — ${formatSpec(p.spec)}`;
      sel.appendChild(opt);
    });
    // Preserve selection if the player is still in this fight; otherwise first player
    if (autoPlayer) sel.value = autoPlayer;
    else if (prev && visible.some(p => String(p.id) === prev)) sel.value = prev;
  }

  async function analyzePlayer() {
    clearError();
    const fightId  = parseInt(document.getElementById('fight-select').value, 10);
    const playerId = parseInt(document.getElementById('player-select').value, 10);

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('results').classList.add('hidden');

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ report_url: reportCode, fight_id: fightId, player_id: playerId }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'Analysis failed');
      renderResults(data);
    } catch (err) {
      showError(err.message);
    } finally {
      document.getElementById('loading').classList.add('hidden');
    }
  }

  function renderResults(data) {
    const el = document.getElementById('results');

    // Bucket findings by CD name vs rotation rules
    const byCD = {};     // cd_name -> {issues: [], holds: []}
    const ruleFindings = [];

    for (const f of data.findings) {
      if (f.severity === 'success') continue; // hide clean CDs entirely
      if (f.category === 'hold_suggestion' && f.details?.cd_name) {
        const n = f.details.cd_name;
        if (!byCD[n]) byCD[n] = { issues: [], holds: [] };
        byCD[n].holds.push(f);
      } else if (f.category === 'rule_violation') {
        ruleFindings.push(f);
      } else if (f.cd_name || f.details?.cd_name) {
        const n = f.cd_name || f.details?.cd_name;
        if (!byCD[n]) byCD[n] = { issues: [], holds: [] };
        byCD[n].issues.push(f);
      } else {
        ruleFindings.push(f);
      }
    }

    const cdHtml = Object.entries(byCD).map(([name, bucket]) => renderCDCard(name, bucket)).join('')
      || (!ruleFindings.length ? '<div class="no-findings">✓ No significant issues detected.</div>' : '');

    // Rotation rules section
    let rulesHtml = '';
    if (ruleFindings.length) {
      rulesHtml = `<p class="section-label" style="margin-top:18px">Rotation Rules</p>
        <div class="rule-list">${ruleFindings.map(renderRuleItem).join('')}</div>`;
    }

    el.innerHTML = `
      <div class="result-header">
        <h2>${data.player} — ${formatSpec(data.spec)}</h2>
      </div>
      <div class="cd-list">${cdHtml}</div>
      ${rulesHtml}
    `;

    el.classList.remove('hidden');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderCDCard(name, bucket) {
    const hasCritical = bucket.issues.some(f => f.severity === 'critical');
    const hasIssue    = bucket.issues.length > 0 || bucket.holds.length > 0;
    const cls = hasCritical ? 'has-critical' : hasIssue ? 'has-issue' : '';
    const chevron = hasIssue ? '<span class="cd-chevron">▶</span>' : '';

    // Compact meta: only show deviations
    const metaParts = [];
    for (const f of bucket.issues) {
      if (f.category === 'lost_cooldown') metaParts.push(`<span class="warn">lost cast</span>`);
      else if (f.category === 'cooldown_delay') metaParts.push(`<span class="warn">held</span>`);
      else if (f.category === 'cooldown_alignment') metaParts.push(`<span class="warn">BL miss</span>`);
      else if (f.category === 'cast_efficiency') metaParts.push(`<span class="warn">downtime</span>`);
    }
    if (bucket.holds.length) metaParts.push(`<span class="warn">${bucket.holds.length} hold tip${bucket.holds.length>1?'s':''}</span>`);
    const meta = metaParts.length ? `<span class="cd-meta">${metaParts.join(' · ')}</span>` : '';

    const allFindings = [...bucket.issues, ...bucket.holds];
    const bodyItems = allFindings.map(f => {
      const ts = f.timestamp_ms != null ? `<span class="cd-issue-ts">${formatMs(f.timestamp_ms)}</span>` : '';
      const remedy = f.details?.remedy ? `<div class="cd-remedy">${f.details.remedy}</div>` : '';
      return `<div class="cd-issue">${ts}<span class="cd-issue-msg">${f.message}</span>${remedy}</div>`;
    }).join('');

    const openCls = hasIssue ? ' open' : '';
    return `
      <div class="cd-card ${cls}${openCls}" onclick="this.classList.toggle('open')">
        <div class="cd-card-header">
          <div class="cd-dot"></div>
          <span class="cd-name">${name}</span>
          ${meta}
          ${chevron}
        </div>
        ${hasIssue ? `<div class="cd-card-body">${bodyItems}</div>` : ''}
      </div>`;
  }

  function renderRuleItem(f) {
    const ts = f.timestamp_ms != null ? `<span class="rule-item-ts">${formatMs(f.timestamp_ms)}</span>` : '';
    const remedy = f.details?.remedy ? `<div class="rule-remedy">${f.details.remedy}</div>` : '';
    const sev = f.severity === 'warning' ? 'sev-warning' : '';
    return `<div class="rule-item ${sev}">${ts}<span class="rule-item-msg">${f.message}</span>${remedy}</div>`;
  }

  // kept for reference by live.html renderFinding fallback — not used in post-raid
  function renderFinding(f) {
    const ts = f.timestamp_ms != null ? `<span style="font-family:monospace;font-size:11px;color:var(--muted);background:var(--surface);padding:1px 5px;border-radius:3px;margin-right:6px">${formatMs(f.timestamp_ms)}</span>` : '';
    const remedy = f.details?.remedy ? `<div style="font-size:12px;color:var(--gold-light);font-style:italic;margin-top:5px">→ ${f.details.remedy}</div>` : '';
    return `<div style="background:var(--surface2);border-radius:6px;border-left:3px solid var(--border);padding:10px 13px;margin-bottom:6px">
      ${ts}<span style="font-size:13px;color:var(--text)">${f.message}</span>${remedy}
      </div>
    `;
  }
</script>
</body>
</html>
