<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-Fight Brief — WoW Analyzer</title>
  <style>
    :root {
      --bg:#0a0c10;--surface:#13161e;--surface2:#1c202c;--border:#2a2f3d;
      --gold:#c8a64f;--gold-light:#e8c86a;--text:#dde1ec;--muted:#7b82a0;
      --critical:#e05252;--warning:#e8a93a;--info:#5b8de8;--success:#4caf7a;
      --radius:8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.6;min-height:100vh}

    .page-nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:4px;padding:8px 16px}
    .page-nav a{color:var(--muted);text-decoration:none;padding:6px 18px;border-radius:6px;font-size:13px;font-weight:600}
    .page-nav a:hover{background:var(--surface2);color:var(--text)}
    .page-nav a.active{background:var(--surface2);color:var(--gold)}

    .container{max-width:900px;margin:0 auto;padding:28px 20px 64px}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .card-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}

    .input-row{display:flex;gap:10px;align-items:flex-end}
    .input-row .form-group{flex:1}
    .form-group label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:14px;outline:none;transition:border-color .15s}
    input:focus,select:focus{border-color:var(--gold)}
    select option{background:var(--surface2)}
    select:disabled{opacity:.45;cursor:not-allowed}
    .btn{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s;white-space:nowrap}
    .btn-primary{background:var(--gold);color:#0a0c10}
    .btn-primary:hover{opacity:.85}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed}

    .char-badge{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border);margin-top:12px}
    .char-badge-name{font-weight:700;color:var(--gold-light)}
    .char-badge-spec{color:var(--muted);font-size:12px}
    .char-badge-report{color:var(--muted);font-size:11px;margin-left:auto}

    /* Gear check cards */
    .gear-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
    @media(max-width:700px){.gear-grid{grid-template-columns:1fr}}
    .gear-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
    .gear-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .gear-status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--muted)}
    .gear-status-dot.ok{background:var(--success)}
    .gear-status-dot.warn{background:var(--warning)}
    .gear-status-dot.missing{background:var(--critical)}
    .gear-status-dot.unknown{background:var(--muted)}
    .gear-card-title{font-weight:700;font-size:13px;color:var(--text)}
    .gear-row{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
    .gear-row:last-child{margin-bottom:0}
    .gear-slot-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .gear-item{font-size:12px;color:var(--text);display:flex;align-items:center;gap:6px}
    .gear-item .ok{color:var(--success)}
    .gear-item .warn{color:var(--warning)}
    .gear-item .missing{color:var(--critical)}
    .gear-item .unknown{color:var(--muted)}
    .wcl-link{color:var(--info);text-decoration:none;}.wcl-link:hover{text-decoration:underline;}
    .gear-top{font-size:11px;color:var(--muted);font-style:italic}

    .no-data-note{font-size:12px;color:var(--muted);font-style:italic}
    .gear-source{font-size:11px;color:var(--muted);padding:0 0 8px;}

    /* CD guide styles */
    .stats-bar{display:flex;gap:32px;padding:8px 0 14px}
    .stat .val{font-size:24px;font-weight:700;color:var(--gold);line-height:1.2}
    .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}

    .cd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:620px){.cd-grid{grid-template-columns:1fr}}
    .cd-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
    .cd-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .cd-name{font-weight:700;color:var(--gold-light);font-size:14px}
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
    .badge-hold{background:rgba(232,169,58,0.18);color:var(--warning)}
    .badge-cd{background:rgba(76,175,122,0.18);color:var(--success)}
    .badge-bl{background:rgba(91,141,232,0.18);color:var(--info)}

    .cd-stats-row{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap}
    .cd-stat{display:flex;flex-direction:column}
    .cd-stat-val{font-weight:600;font-size:13px}
    .cd-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

    .hold-note{background:rgba(232,169,58,0.09);border:1px solid rgba(232,169,58,0.25);border-radius:5px;padding:5px 9px;font-size:12px;color:var(--warning);margin-bottom:6px;line-height:1.4}
    .cd-rule{font-size:12px;color:var(--muted);font-style:italic;line-height:1.4;border-top:1px solid rgba(255,255,255,0.05);padding-top:7px;margin-top:4px}

    .bw-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(42,47,61,0.5);font-size:13px}
    .bw-row:last-child{border-bottom:none}
    .bw-time{font-family:monospace;font-weight:700;min-width:72px}
    .bw-cds{color:var(--muted);font-size:12px;flex:1}
    .bw-aoe{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px;background:rgba(91,141,232,0.15);color:#5b8de8;white-space:nowrap}

    .error-msg{background:rgba(224,82,82,0.1);border:1px solid rgba(224,82,82,0.3);border-radius:var(--radius);padding:12px 16px;color:var(--critical);font-size:13px;margin-bottom:14px}
    .hidden{display:none!important}
    .empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px}
    .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<nav class="page-nav" style="position:relative">
  <a href="pre.html" class="active">Pre-Fight</a>
  <a href="live.html">Live</a>
  <a href="index.html">Post-Raid</a>
  <div style="position:absolute;right:16px">
    <button id="wcl-btn" style="display:none;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer" onclick="toggleWclAuth()"></button>
  </div>
</nav>

<div id="auth-banner" style="display:none;background:rgba(200,166,79,.08);border:1px solid rgba(200,166,79,.3);border-radius:8px;padding:20px 24px;text-align:center;margin:20px auto;max-width:900px">
  <h3 style="color:var(--gold);margin-bottom:8px">Connect Warcraft Logs</h3>
  <p style="color:var(--muted);font-size:13px;margin-bottom:16px">The pre-fight check fetches your gear directly from Warcraft Logs.<br>Connect once and your browser will remember your session.</p>
  <button onclick="wclLogin()" style="background:var(--gold);color:#0a0c10;border:none;border-radius:6px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer">Connect WCL</button>
</div>
<div class="container">

  <!-- Input card -->
  <div class="card">
    <div class="input-row">
      <div class="form-group">
        <label for="char-url">Character URL</label>
        <input id="char-url" type="text"
          placeholder="https://www.warcraftlogs.com/character/us/stormrage/Name"
          onkeydown="if(event.key==='Enter') loadChar()" />
      </div>
      <button class="btn btn-primary" onclick="loadChar()" id="load-btn">Load</button>
    </div>
    <div id="char-badge" class="char-badge hidden">
      <div class="gear-status-dot ok"></div>
      <span id="char-badge-name" class="char-badge-name"></span>
      <span id="char-badge-spec" class="char-badge-spec"></span>
      <span id="char-badge-report" class="char-badge-report"></span>
    </div>
    <div id="enc-row" class="hidden" style="margin-top:12px">
      <div class="form-group">
        <label for="enc-sel">Encounter</label>
        <select id="enc-sel" onchange="onEncChange()" disabled>
          <option value="">— select encounter —</option>
        </select>
      </div>
    </div>
  </div>

  <div id="error-box" class="error-msg hidden"></div>
  <div id="char-loading" class="hidden"><div class="empty-state"><div class="spinner"></div>Looking up character…</div></div>

  <!-- Gear check section (shown after char load, before encounter select) -->
  <div id="gear-section" class="hidden">
    <div class="card">
      <div class="card-title">Gear &amp; Talents Check</div>
      <div id="gear-grid" class="gear-grid"></div>
      <div id="gear-no-data" class="hidden no-data-note">Select an encounter to compare against top parses.</div>
    </div>
  </div>

  <!-- CD guide + burst windows (shown after encounter select) -->
  <div id="brief-loading" class="hidden"><div class="empty-state"><div class="spinner"></div>Loading brief…</div></div>
  <div id="brief"></div>

</div>

<script src="wcl.js"></script>
<script>
  let _spec = '';
  let _encId = 0;
  let _charGear = null;
  let _charName = '';
  let _charServer = '';
  let _charRegion = '';

  const _DATA_BASE_PRE = (() => {
    const path = window.location.pathname;
    const idx  = path.indexOf('/static/');
    const root = idx >= 0 ? path.slice(0, idx) : '';
    return root + '/data/specs/';
  })();

  // WCL gear array is 0-based positional. Weapons land at 15/16 in Midnight (Back at 14).
  const SLOT_NAMES = {
    0:'Head', 1:'Neck', 2:'Shoulder', 3:'Back', 4:'Chest',
    5:'Waist', 6:'Legs', 7:'Feet', 8:'Wrists', 9:'Hands',
    10:'Ring 1', 11:'Ring 2', 12:'Trinket 1', 13:'Trinket 2',
    14:'Back', 15:'Main Hand', 16:'Off Hand',
  };

  function fmt(s) {
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }
  function fmtSpec(s) { return s ? s.replace(/([A-Z])/g,' $1').trim() : ''; }

  async function apiFetch(url) {
    const r = await fetch(url);
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('json')) return null;
    return r.ok ? r.json() : null;
  }

  async function _staticFetch(path) {
    try {
      const r = await fetch(path);
      return r.ok ? r.json() : null;
    } catch { return null; }
  }

  function _wclAvailable() { return typeof wclIsLoggedIn !== 'undefined' && wclIsLoggedIn(); }

  // ── WCL auth UI ──────────────────────────────────────────────────────────────

  const _IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);

  function _updateWclUI() {
    const btn    = document.getElementById('wcl-btn');
    const banner = document.getElementById('auth-banner');
    const loggedIn = typeof wclIsLoggedIn !== 'undefined' && wclIsLoggedIn();
    const showMain = _IS_LOCAL || loggedIn;
    if (loggedIn) {
      btn.textContent = 'WCL ✓';
      btn.style.color = 'var(--success)';
      btn.style.borderColor = 'var(--success)';
    } else {
      btn.textContent = 'Connect WCL';
      btn.style.color = '';
      btn.style.borderColor = '';
    }
    btn.style.display = '';
    banner.style.display = showMain ? 'none' : '';
  }

  function toggleWclAuth() {
    if (typeof wclIsLoggedIn === 'undefined') return;
    if (wclIsLoggedIn()) {
      if (confirm('Disconnect from Warcraft Logs?')) { wclClearToken(); _updateWclUI(); }
    } else { wclLogin(); }
  }

  function syncURL() {
    const p = new URLSearchParams();
    const url = document.getElementById('char-url').value.trim();
    if (url) p.set('url', url);
    if (_encId) p.set('encounter', _encId);
    history.replaceState({}, '', p.toString() ? `?${p}` : location.pathname);
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = `⚠ ${msg}`;
    el.classList.remove('hidden');
  }
  function clearError() { document.getElementById('error-box').classList.add('hidden'); }

  window.onload = async () => {
    _updateWclUI();
    const p = new URLSearchParams(location.search);
    const url = p.get('url');
    if (url) {
      document.getElementById('char-url').value = url;
      await loadChar(parseInt(p.get('encounter') || '0', 10));
    }
  };

  // ── Character loading ─────────────────────────────────────────────────────

  async function loadChar(autoEnc = null) {
    const url = document.getElementById('char-url').value.trim();
    if (!url) return;
    clearError();
    document.getElementById('char-loading').classList.remove('hidden');
    document.getElementById('char-badge').classList.add('hidden');
    document.getElementById('enc-row').classList.add('hidden');
    document.getElementById('gear-section').classList.add('hidden');
    document.getElementById('brief').innerHTML = '';
    document.getElementById('load-btn').disabled = true;
    _charGear = null; _spec = ''; _encId = 0;

    try {
      let data;
      if (_wclAvailable()) {
        data = await wclCharLookup(url);
      } else {
        data = await apiFetch(`/api/pre/char-lookup?url=${encodeURIComponent(url)}`);
        if (!data) throw new Error('Backend server is not available. Run the server locally, or Connect WCL to use online.');
      }

      _spec = data.spec || '';
      _charName = data.name || '';
      _charServer = data.server || '';
      _charRegion = data.region || '';

      try {
        localStorage.setItem('wcl_saved_char', JSON.stringify({
          name: data.name, url, server: data.server, region: data.region, spec: data.spec
        }));
      } catch (_) {}

      document.getElementById('char-badge-name').textContent = data.name;
      document.getElementById('char-badge-spec').textContent = fmtSpec(data.spec) + (data.server ? ` — ${data.server}` : '');
      document.getElementById('char-badge-report').textContent = data.source_report ? `from ${data.source_report}` : '';
      document.getElementById('char-badge').classList.remove('hidden');
      document.getElementById('gear-grid').innerHTML = '';
      document.getElementById('gear-section').classList.remove('hidden');
      document.getElementById('gear-no-data').classList.remove('hidden');

      await populateEncounters(autoEnc);
      syncURL();
    } catch (err) {
      showError(err.message);
    } finally {
      document.getElementById('char-loading').classList.add('hidden');
      document.getElementById('load-btn').disabled = false;
    }
  }

  async function populateEncounters(autoEnc = null) {
    const encSel = document.getElementById('enc-sel');
    encSel.innerHTML = '<option>Loading…</option>';
    encSel.disabled = true;
    document.getElementById('enc-row').classList.remove('hidden');

    let encounters = [];
    if (_spec) {
      // Try static encounters.json first
      const idx = await _staticFetch(`${_DATA_BASE_PRE}${_spec}/encounters.json`);
      if (idx?.length) {
        encounters = idx.filter(e => e.sample_count > 0)
          .map(e => ({id: e.id, name: `${e.name}  (${e.sample_count} parses)`}));
      } else {
        // Fall back to backend
        const data = await apiFetch(`/api/admin/parses/stats/${_spec}`);
        encounters = Object.entries(data?.stats || {})
          .map(([enc_id, s]) => ({...s, encounter_id: parseInt(enc_id, 10)}))
          .filter(s => s.sample_count > 0)
          .map(s => ({id: s.encounter_id, name: `${s.encounter_name}  (${s.sample_count} parses)`}));
      }
    } else {
      const data = await apiFetch('/api/admin/encounters');
      encounters = (data?.encounters || []).map(e => ({id: e.id, name: e.name}));
    }

    encSel.innerHTML = '<option value="">— select encounter —</option>';
    if (!encounters.length) {
      encSel.innerHTML = '<option value="">No data — run Parse Ingestion in Admin first</option>';
      encSel.disabled = false; return;
    }
    encounters.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id; o.textContent = e.name;
      encSel.appendChild(o);
    });
    encSel.disabled = false;
    if (autoEnc && encounters.some(e => e.id === autoEnc)) {
      encSel.value = autoEnc;
      await onEncChange();
    }
  }

  // ── Encounter selection ───────────────────────────────────────────────────

  async function onEncChange() {
    _encId = parseInt(document.getElementById('enc-sel').value || '0', 10);
    syncURL();
    document.getElementById('brief').innerHTML = '';
    if (!_encId) {
      document.getElementById('gear-grid').innerHTML = '';
      document.getElementById('gear-no-data').classList.remove('hidden');
      return;
    }
    document.getElementById('gear-no-data').classList.add('hidden');
    document.getElementById('brief-loading').classList.remove('hidden');

    let charGearData, benchData;

    if (!_spec) {
      // Spec unknown — need to get it from char gear first
      if (_wclAvailable()) {
        charGearData = await wclGetCharGear(_charName, _charServer, _charRegion, _encId);
      } else {
        charGearData = await apiFetch(
          `/api/pre/char-gear?name=${encodeURIComponent(_charName)}&server=${encodeURIComponent(_charServer)}&region=${encodeURIComponent(_charRegion)}&encounter_id=${_encId}`
        );
      }
      if (charGearData?.found && charGearData.spec) {
        _spec = charGearData.spec;
        populateEncounters(_encId); // refresh list now we know spec
      }
    }

    if (_spec) {
      const charGearProm = charGearData
        ? Promise.resolve(charGearData)
        : (_wclAvailable()
            ? wclGetCharGear(_charName, _charServer, _charRegion, _encId)
            : apiFetch(`/api/pre/char-gear?name=${encodeURIComponent(_charName)}&server=${encodeURIComponent(_charServer)}&region=${encodeURIComponent(_charRegion)}&encounter_id=${_encId}`)
          );
      [charGearData, benchData] = await Promise.all([
        charGearProm,
        _staticFetch(`${_DATA_BASE_PRE}${_spec}/encounters/${_encId}.json`),
      ]);
      // Fallback: if static bench not available, try server
      if (!benchData) {
        benchData = await apiFetch(`/api/pre/gear-stats/${_spec}/${_encId}`);
      }
    } else {
      if (!charGearData) {
        if (_wclAvailable()) {
          charGearData = await wclGetCharGear(_charName, _charServer, _charRegion, _encId);
        } else {
          charGearData = await apiFetch(
            `/api/pre/char-gear?name=${encodeURIComponent(_charName)}&server=${encodeURIComponent(_charServer)}&region=${encodeURIComponent(_charRegion)}&encounter_id=${_encId}`
          );
        }
      }
    }

    document.getElementById('brief-loading').classList.add('hidden');

    if (charGearData?.found) _charGear = charGearData;

    // Bench file contains both gear-stats and brief data in one file
    const topGearData = benchData?.gear ?? benchData ?? null;
    renderGearCards(topGearData);

    if (benchData && _spec) {
      // Build brief from bench file + rulebook
      const rulebook = await _staticFetch(`${_DATA_BASE_PRE}${_spec}/rulebook.json`);
      renderBriefFromBench(benchData, rulebook);
    }
  }

  // ── Gear check rendering ──────────────────────────────────────────────────

  function renderGearCards(topStats) {
    const grid = document.getElementById('gear-grid');
    if (!_charGear) {
      if (!topStats) { grid.innerHTML = ''; return; }
      // No char gear but have top stats — show "no ranked data" state in each card
      grid.innerHTML = ['Talents', 'Trinkets', 'Enchants'].map(title => `
        <div class="gear-card">
          <div class="gear-card-head">
            <div class="gear-status-dot unknown"></div>
            <span class="gear-card-title">${title}</span>
          </div>
          <p class="no-data-note">No ranked kill found for this encounter. Upload a log with advanced combat logging to compare.</p>
        </div>`).join('');
      return;
    }

    grid.innerHTML = [
      renderTalentCard(topStats),
      renderTrinketCard(topStats),
      renderEnchantCard(topStats),
    ].join('');
  }

  function gearStatusIcon(status) {
    if (status === 'ok')      return '<span class="ok">✓</span>';
    if (status === 'warn')    return '<span class="warn">⚠</span>';
    if (status === 'missing') return '<span class="missing">✗</span>';
    return '<span class="unknown">—</span>';
  }

  function overallStatus(statuses) {
    if (statuses.includes('missing')) return 'missing';
    if (statuses.includes('warn'))    return 'warn';
    if (statuses.every(s => s === 'ok')) return 'ok';
    return 'unknown';
  }

  function renderTalentCard(topStats) {
    const builds = topStats?.talent_builds || [];
    const playerKey = _charGear.talent_key || '';

    let status = 'unknown';
    let bodyHtml = '';

    if (!builds.length) {
      bodyHtml = '<p class="no-data-note">No talent data yet — re-run Parse Ingestion.</p>';
    } else if (!playerKey) {
      bodyHtml = '<p class="no-data-note">Talent data not available from WCL for this character.</p>';
    } else {
      // Only compare if both keys use the same version prefix
      const playerVersion = playerKey.split(':')[0];
      const topVersion = (builds[0]?.key || '').split(':')[0];

      if (playerVersion !== topVersion) {
        // v1 (characterRankings) and v2 (encounterRankings) use different ID spaces — not comparable
        status = 'unknown';
        bodyHtml = `<div class="gear-item"><span class="unknown">—</span> Talent comparison unavailable — WCL uses different talent ID formats for different query types.</div>`;
      } else {
        const match = builds.find(b => b.key === playerKey);
        const matchPct = match?.pct ?? 0;
        status = (match && match.pct >= 40) ? 'ok' : 'warn';
        if (status === 'ok') {
          bodyHtml = `<div class="gear-item"><span class="ok">✓</span> Matches top parse build (${matchPct}% of parses)</div>`;
        } else {
          const top = builds[0];
          let wclLink = '';
          if (top?.report_code) {
            const href = top.fight_id
              ? `https://www.warcraftlogs.com/reports/${top.report_code}?fight=${top.fight_id}&type=summary`
              : `https://www.warcraftlogs.com/reports/${top.report_code}`;
            const label = top.player_name ? `View ${top.player_name} on WCL` : 'View on WCL';
            wclLink = ` — <a href="${href}" target="_blank" rel="noopener" class="wcl-link">${label}</a>`;
          }
          bodyHtml = `<div class="gear-item"><span class="warn">⚠</span> Build differs — most common used by ${top?.pct ?? 0}% of top parsers${wclLink}</div>`;
        }
      }
    }

    return `<div class="gear-card">
      <div class="gear-card-head">
        <div class="gear-status-dot ${status}"></div>
        <span class="gear-card-title">Talents</span>
      </div>
      ${bodyHtml}
    </div>`;
  }

  function renderTrinketCard(topStats) {
    const topTrinkets = topStats?.trinkets || {};
    const statuses = [];
    let bodyHtml = '';

    for (const slot of [12, 13]) {
      const slotName = SLOT_NAMES[slot];
      const playerItem = _charGear.trinkets.find(t => t.slot === slot);
      const topItems = topTrinkets[slot] || [];

      let status = 'unknown';
      let note = '';

      if (!topItems.length) {
        note = playerItem ? playerItem.name || `Item #${playerItem.id}` : '—';
        status = 'unknown';
      } else if (!playerItem) {
        note = `<span class="missing">missing</span>`;
        status = 'missing';
      } else {
        const inTop = topItems.find(t => t.id === playerItem.id);
        status = inTop ? 'ok' : 'warn';
        note = `${gearStatusIcon(status)} ${playerItem.name || `Item #${playerItem.id}`}`;
        if (!inTop && topItems[0]) {
          note += `<div class="gear-top">Top: ${topItems[0].name || `#${topItems[0].id}`} (${topItems[0].pct}%)</div>`;
        }
      }

      statuses.push(status);
      bodyHtml += `<div class="gear-row">
        <div class="gear-slot-label">${slotName}</div>
        <div class="gear-item">${note}</div>
      </div>`;
    }

    return `<div class="gear-card">
      <div class="gear-card-head">
        <div class="gear-status-dot ${overallStatus(statuses)}"></div>
        <span class="gear-card-title">Trinkets</span>
      </div>
      ${bodyHtml}
    </div>`;
  }

  function renderEnchantCard(topStats) {
    const topEnchants = topStats?.enchants || {};
    const statuses = [];
    let bodyHtml = '';

    // Collect all slots present in either player or top data
    const playerSlots = new Set(_charGear.enchants.map(e => e.slot)
      .concat(_charGear.missing_enchant_slots));
    const topSlots = new Set(Object.keys(topEnchants).map(Number));
    const allSlots = [...new Set([...playerSlots, ...topSlots])]
      .filter(s => SLOT_NAMES[s])
      .sort((a, b) => a - b);

    if (!allSlots.length) {
      return `<div class="gear-card">
        <div class="gear-card-head">
          <div class="gear-status-dot unknown"></div>
          <span class="gear-card-title">Enchants</span>
        </div>
        <p class="no-data-note">No enchant data yet — re-run Parse Ingestion.</p>
      </div>`;
    }

    for (const slot of allSlots) {
      const slotName = SLOT_NAMES[slot];
      const playerEnc = _charGear.enchants.find(e => e.slot === slot);
      const topItems = topEnchants[slot] || [];
      const topEnc = topItems[0];

      let status = 'unknown';
      let note = '';

      const eName = (id, name) => {
        const n = name || `Enchant #${id}`;
        return `<a href="https://www.wowhead.com/enchant=${id}" target="_blank" style="color:inherit;text-decoration:none" title="Wowhead enchant ${id}">${n}</a>`;
      };
      if (!topItems.length) {
        note = playerEnc ? eName(playerEnc.id, playerEnc.name) : '—';
        status = 'unknown';
      } else if (!playerEnc) {
        if (topEnc && topEnc.pct >= 70) {
          status = 'missing';
          note = `<span class="missing">missing</span><div class="gear-top">Top: ${eName(topEnc.id, topEnc.name)} (${topEnc.pct}%)</div>`;
        } else {
          status = 'ok';
          note = '—';
        }
      } else if (topEnc && playerEnc.id === topEnc.id) {
        status = 'ok';
        note = `${gearStatusIcon('ok')} ${eName(playerEnc.id, playerEnc.name)}`;
      } else {
        const inTop = topItems.find(t => t.id === playerEnc.id);
        status = inTop ? 'ok' : 'warn';
        note = `${gearStatusIcon(status)} ${eName(playerEnc.id, playerEnc.name)}`;
        if (!inTop && topEnc) {
          note += `<div class="gear-top">Top: ${eName(topEnc.id, topEnc.name)} (${topEnc.pct}%)</div>`;
        }
      }

      statuses.push(status);
      bodyHtml += `<div class="gear-row">
        <div class="gear-slot-label">${slotName}</div>
        <div class="gear-item">${note}</div>
      </div>`;
    }

    const sourceNote = _charGear?.source_time
      ? `<div class="gear-source">Gear from: ${new Date(_charGear.source_time).toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'})}${_charGear.source_report ? ` · <a href="https://www.warcraftlogs.com/reports/${_charGear.source_report}" target="_blank" style="color:var(--gold)">log</a>` : ''}</div>`
      : '';

    return `<div class="gear-card">
      <div class="gear-card-head">
        <div class="gear-status-dot ${overallStatus(statuses)}"></div>
        <span class="gear-card-title">Enchants</span>
      </div>
      ${sourceNote}
      ${bodyHtml || '<p class="no-data-note">No enchant data yet — re-run Parse Ingestion.</p>'}
    </div>`;
  }

  // ── CD guide + burst windows rendering ───────────────────────────────────

  // Renders the brief from a bench file (data/specs/{spec}/encounters/{id}.json)
  // combined with an optional rulebook for usage_rule + align_with_bloodlust.
  function renderBriefFromBench(bench, rulebook) {
    const div = document.getElementById('brief');
    if (!bench?.sample_count) {
      div.innerHTML = '<div class="empty-state">No parse data for this encounter. Run top-parse ingestion in Admin first.</div>';
      return;
    }

    const rb_cds = {};
    for (const cd of (rulebook?.major_cooldowns || [])) rb_cds[cd.name] = cd;

    const statsHtml = bench.avg_duration_s ? `
      <div class="card">
        <div class="stats-bar">
          <div class="stat"><div class="val">${fmt(bench.avg_duration_s)}</div><div class="lbl">Avg Kill Time</div></div>
          ${bench.burst_windows?.length ? `<div class="stat"><div class="val">${bench.burst_windows.length}</div><div class="lbl">Burst Windows</div></div>` : ''}
        </div>
      </div>` : '';

    const cdEntries = Object.entries(bench.per_cd_benchmarks || {});
    let cdSection = '';
    if (cdEntries.length) {
      const cards = cdEntries.map(([name, cd]) => {
        const rbCd = rb_cds[name] || {};
        const openStr = cd.avg_first_cast_s != null
          ? `~${fmt(cd.avg_first_cast_s)}${cd.stddev_first_cast_s != null ? ` <small style="opacity:.6">±${cd.stddev_first_cast_s}s</small>` : ''}`
          : '—';
        const pattern = cd.majority_hold
          ? '<span class="badge badge-hold">hold</span>'
          : '<span class="badge badge-cd">on cd</span>';
        const alignBL = rbCd.align_with_bloodlust ?? false;
        const blBadge = alignBL && cd.bl_pct >= 70
          ? `<span class="badge badge-bl">${cd.bl_pct}% BL</span>` : '';

        const holdNotes = Object.entries(cd.hold_targets || {}).map(([idx, ht]) =>
          `<div class="hold-note">Cast ${idx}: hold to ~${fmt(ht.target_s)} <span style="opacity:.6">±${ht.stddev_s}s · ${ht.count}/${ht.total_samples} parsers</span></div>`
        ).join('');

        return `<div class="cd-card">
          <div class="cd-card-head">
            <span class="cd-name">${name}</span>
            <span style="display:flex;gap:5px">${pattern}${blBadge}</span>
          </div>
          <div class="cd-stats-row">
            <div class="cd-stat"><div class="cd-stat-val">${openStr}</div><div class="cd-stat-lbl">Opener</div></div>
            <div class="cd-stat"><div class="cd-stat-val">${cd.avg_uses ?? '—'}</div><div class="cd-stat-lbl">Avg uses</div></div>
            <div class="cd-stat"><div class="cd-stat-val">${cd.avg_uses_per_min ?? '—'}<small style="opacity:.6">/min</small></div><div class="cd-stat-lbl">Rate</div></div>
            ${alignBL ? `<div class="cd-stat"><div class="cd-stat-val">${cd.bl_pct}%</div><div class="cd-stat-lbl">BL aligned</div></div>` : ''}
          </div>
          ${holdNotes}
          ${rbCd.usage_rule ? `<div class="cd-rule">"${rbCd.usage_rule}"</div>` : ''}
        </div>`;
      }).join('');
      cdSection = `<div class="card"><div class="card-title">Cooldown Guide — what the best do</div><div class="cd-grid">${cards}</div></div>`;
    }

    let bwSection = '';
    if (bench.burst_windows?.length) {
      const rows = bench.burst_windows.map(bw => {
        const sdStr = bw.stddev_s > 0 ? ` <small style="opacity:.5">±${bw.stddev_s}s</small>` : '';
        const cds = bw.common_cds?.length ? bw.common_cds.join(', ') : '<span style="opacity:.5">no tracked CD</span>';
        const aoe = (bw.avg_targets ?? 1) >= 2 ? '<span class="bw-aoe">AoE</span>' : '';
        return `<div class="bw-row">
          <div class="bw-time">${fmt(bw.time_s)}${sdStr}</div>
          <div class="bw-cds">${cds}</div>
          ${aoe}
        </div>`;
      }).join('');
      bwSection = `<div class="card"><div class="card-title">Burst Windows</div>${rows}</div>`;
    }

    div.innerHTML = statsHtml + cdSection + bwSection;
  }
</script>
</body>
</html>
