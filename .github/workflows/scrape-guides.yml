name: Scrape Guide

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'WCL spec name, e.g. SubtletyRogue'
        required: true
      url:
        description: 'Guide URL to scrape'
        required: true
      guide_type:
        description: 'Guide type'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - youtube
          - simc

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Scrape guide
        run: |
          node frontend/scripts/scrape.mjs \
            --spec "${{ github.event.inputs.spec }}" \
            --url "${{ github.event.inputs.url }}" \
            --type "${{ github.event.inputs.guide_type }}"

      - name: Commit updated spec files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: add guide for ${{ github.event.inputs.spec }} [skip ci]'
          file_pattern: 'frontend/public/data/specs/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
