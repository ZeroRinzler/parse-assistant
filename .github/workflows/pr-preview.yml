name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Overlay the generated bench data so the preview ships parse data. The data lives on the
      # public, always-squashed `data` branch; a plain read-only checkout is enough - we do NOT
      # pass the app token here, so this step adds no new secret exposure to PR-triggered runs.
      - name: Check out bench data (public data branch)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: data
          path: _data-branch

      - name: Overlay bench data into the build
        run: |
          mkdir -p frontend/public/data/specs
          cp -a _data-branch/frontend/public/data/specs/. frontend/public/data/specs/
          rm -rf _data-branch

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --base-href /warcraft-learner/pr-${{ github.event.pull_request.number }}/
        working-directory: frontend

      - name: Copy 404 fallback for SPA routing
        run: cp static/angular/browser/index.html static/angular/browser/404.html

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - name: Create GitHub deployment
        id: create-deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-preview-${pr}`,
              description: `Preview for PR #${pr}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
            });
            core.setOutput('deployment_id', deployment.id);

      - name: Deploy preview to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          folder: static/angular/browser
          target-folder: pr-${{ github.event.pull_request.number }}
          clean: true

      - name: Set deployment status to success
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://gpolcode.github.io/warcraft-learner/pr-${pr}/`;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number('${{ steps.create-deployment.outputs.deployment_id }}'),
              state: 'success',
              environment_url: url,
              description: 'Preview ready',
            });
