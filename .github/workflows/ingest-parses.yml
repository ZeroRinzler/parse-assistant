name: Ingest Parse Samples

on:
  # Hourly scheduling is driven by an EXTERNAL scheduler (cron-job.org) that calls the
  # workflow_dispatch REST API once an hour. GitHub's own schedule: cron was removed - it
  # dropped most fires under load (3 fires in 7 hours observed) and ignores the set minute.
  workflow_dispatch:

concurrency:
  group: ingest-parses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Re-scrape every existing guide first so guides.json stays fresh on the same cadence.
      # Per-guide errors are recorded, not fatal. YouTube transcripts go through the Supadata
      # API (SUPADATA_API_KEY secret); already-scraped YouTube guides are skipped, so the
      # metered API is only hit once per new/errored video. Web/SimC need no secret.
      - name: Refresh guide content
        working-directory: frontend
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: npm run scrape

      # Ingestion self-selects the current live raids from WCL (current expansion,
      # non-frozen zones confirmed live by a rankings probe) and self-prunes data for
      # encounters that are no longer current. No manual per-patch edits needed.
      - name: Run parse ingestion
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        working-directory: frontend
        run: npm run ingest

      - name: Pull latest before committing
        env:
          BRANCH: ${{ github.ref_name }}
        # --autostash so the ingest's unstaged spec-file changes don't block the
        # rebase ("cannot pull with rebase: You have unstaged changes"); they are
        # stashed, the rebase runs, then they are reapplied for the commit step.
        run: git pull --rebase --autostash origin "$BRANCH"

      - name: Commit updated spec files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # No [skip ci] - data commits should trigger deploy-pages so the live
          # site reflects fresh parse data. git-auto-commit-action only pushes
          # when files actually changed, so quiet hours produce no commit.
          commit_message: 'chore: refresh parse samples'
          file_pattern: 'frontend/public/data/specs/**'
          commit_user_name: 'warcraft-learner-ingest[bot]'
          commit_user_email: 'warcraft-learner-ingest[bot]@users.noreply.github.com'
