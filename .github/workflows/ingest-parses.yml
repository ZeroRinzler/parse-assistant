name: Ingest Parse Samples

on:
  schedule:
    # Runs daily at 06:00 UTC - after EU/US raid nights have concluded
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec to ingest (leave empty to ingest all specs with existing data)'
        required: false
        default: ''
      top_n:
        description: 'Number of top parses per boss'
        required: false
        default: '10'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run parse ingestion
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          SPEC="${{ github.event.inputs.spec }}"
          TOP_N="${{ github.event.inputs.top_n || '10' }}"
          if [ -n "$SPEC" ]; then
            node frontend/scripts/ingest.mjs --spec "$SPEC" --top-n "$TOP_N"
          else
            node frontend/scripts/ingest.mjs --all --top-n "$TOP_N"
          fi

      - name: Commit updated spec files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh parse samples [skip ci]'
          file_pattern: 'frontend/public/data/specs/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
