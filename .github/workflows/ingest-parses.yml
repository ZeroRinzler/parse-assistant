name: Ingest Parse Samples

on:
  # Hourly scheduling is driven by an EXTERNAL scheduler (cron-job.org) that calls the
  # workflow_dispatch REST API once an hour. GitHub's own schedule: cron was removed - it
  # dropped most fires under load (3 fires in 7 hours observed) and ignores the set minute.
  workflow_dispatch:

# Shared with deploy-pages and pr-preview - see the note there. This job owns the data/ tree
# on gh-pages; serializing all gh-pages writers keeps their single-commit force-pushes from
# reverting each other's folder.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          # Fetch all refs so origin/gh-pages survives locally even if the overlay step's explicit
          # fetch fails; losing it before the clean:true publish would wipe the gh-pages-only data.
          fetch-depth: 0

      # The generated bench data is NOT tracked on main - it lives once at the gh-pages root
      # under data/specs/ (this workflow is its only writer). Overlay that copy into the working
      # tree BEFORE scrape/ingest so the orchestrator's signature-skip has the current data on
      # disk to compare against. Untracked worktree only, so the paths stay ignored on main. On
      # the very first run gh-pages has no data yet, so the archive is a no-op and ingest starts
      # from empty.
      - name: Overlay bench data from gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          rm -rf frontend/public/data/specs
          # When gh-pages has data, a failed extraction must abort (no `|| echo` swallow): an empty
          # tree would otherwise reach the clean:true publish and delete every spec and rulebook.
          # An absent tree is a legitimate first run.
          if git rev-parse --verify --quiet origin/gh-pages >/dev/null \
            && git ls-tree --name-only "origin/gh-pages:data/specs" >/dev/null 2>&1; then
            git archive origin/gh-pages data/specs | tar -x -C frontend/public
            echo "Overlaid existing bench data from gh-pages."
          else
            echo "No existing data on gh-pages; starting from empty (first run)."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Ingestion self-selects the current live raids from WCL (current expansion,
      # non-frozen zones confirmed live by a rankings probe) and self-prunes data for
      # encounters that are no longer current. No manual per-patch edits needed.
      - name: Run parse ingestion
        working-directory: frontend
        run: npm run ingest

      # Backstop for the clean:true publish: an empty tree over a populated gh-pages would delete
      # every spec and rulebook. Pruning never removes whole spec dirs, so this only trips on the
      # empty/partial-overlay catastrophe, not a quiet hour.
      - name: Guard against an empty publish tree
        run: |
          set -euo pipefail
          dir=frontend/public/data/specs
          local_specs=$( { find "$dir" -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true; } | wc -l | tr -d ' ')
          remote_specs=$( { git ls-tree -d --name-only "origin/gh-pages:data/specs" 2>/dev/null || true; } | wc -l | tr -d ' ')
          echo "Working tree has $local_specs spec dir(s); gh-pages has $remote_specs."
          if [ "$remote_specs" -gt 0 ] && [ "$local_specs" -eq 0 ]; then
            echo "::error::Refusing to publish: the working tree has no spec data while gh-pages has $remote_specs spec dir(s). A clean:true publish would wipe the published data and rulebooks."
            exit 1
          fi

      # Publish the fresh (minified) data into the data/specs/ folder at the gh-pages root.
      # clean:true is scoped to the target-folder, so it replaces data/specs/ only and never
      # touches main/ or the pr-* previews. The action commits nothing when the tree is byte-identical,
      # so quiet hours produce no push and no needless redeploy. The site reads this copy
      # directly (no rebuild needed), so publishing the data IS the deploy.
      - name: Publish data to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: frontend/public/data/specs
          target-folder: data/specs
          clean: true
