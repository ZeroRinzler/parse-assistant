name: Ingest Parse Samples

on:
  schedule:
    # Runs daily at 06:00 UTC - after EU/US raid nights have concluded
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec to ingest (leave empty to ingest all specs with existing data)'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run parse ingestion
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          # Bind the dispatch input to an env var rather than interpolating it
          # directly into the script - prevents shell injection via the input.
          SPEC: ${{ github.event.inputs.spec }}
        run: |
          if [ -n "$SPEC" ]; then
            node frontend/scripts/ingest.mjs --spec "$SPEC"
          else
            node frontend/scripts/ingest.mjs --all
          fi

      - name: Pull latest before committing
        env:
          BRANCH: ${{ github.ref_name }}
        run: git pull --rebase origin "$BRANCH"

      - name: Commit updated spec files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh parse samples [skip ci]'
          file_pattern: 'frontend/public/data/specs/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
