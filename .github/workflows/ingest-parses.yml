name: Ingest Parse Samples

on:
  # Hourly scheduling is driven by an EXTERNAL scheduler (cron-job.org) that calls the
  # workflow_dispatch REST API once an hour. GitHub's own schedule: cron was removed - it
  # dropped most fires under load (3 fires in 7 hours observed) and ignores the set minute.
  workflow_dispatch:

concurrency:
  group: ingest-parses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}
          # Full history: the orchestrator orders specs by the git last-commit time of each
          # spec's data dir (git-mtime.ts). A shallow clone collapses every path's git log to
          # one commit, which would make all specs tie.
          fetch-depth: 0

      # The generated bench data is NOT tracked on main - it lives on the always-squashed
      # `data` branch (one orphan commit, force-pushed each run). Overlay that snapshot into
      # the working tree BEFORE scrape/ingest so the orchestrator's signature-skip has the
      # current data on disk to compare against. --worktree only (never staged), so the paths
      # stay ignored and cannot leak back onto main.
      - name: Overlay bench data from the data branch
        run: |
          git fetch origin data
          git restore --source=origin/data --worktree -- frontend/public/data/specs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Re-scrape every existing guide first so guides.json stays fresh on the same cadence.
      # Per-guide errors are recorded, not fatal. YouTube transcripts go through the Supadata
      # API (SUPADATA_API_KEY secret); already-scraped YouTube guides are skipped, so the
      # metered API is only hit once per new/errored video. Web/SimC need no secret.
      - name: Refresh guide content
        working-directory: frontend
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: npm run scrape

      # Ingestion self-selects the current live raids from WCL (current expansion,
      # non-frozen zones confirmed live by a rankings probe) and self-prunes data for
      # encounters that are no longer current. No manual per-patch edits needed.
      - name: Run parse ingestion
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        working-directory: frontend
        run: npm run ingest

      # Publish the fresh data as a single orphan (root) commit, force-pushed to the `data`
      # branch. History never grows: the branch tip is always exactly one commit holding the
      # current frontend/public/data/specs snapshot. This replaces the old auto-commit-to-main
      # step - main no longer carries multi-MB data churn. The force-push to `data` is itself a
      # deploy-pages trigger (that workflow watches `main` and `data`), so a changed snapshot
      # redeploys the live site with fresh parse data.
      - name: Publish snapshot to the data branch
        id: publish
        run: |
          set -euo pipefail
          # Nothing to publish if ingest produced no directory (defensive).
          if [ ! -d frontend/public/data/specs ]; then
            echo "No data directory to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'warcraft-learner-ingest[bot]'
          git config user.email 'warcraft-learner-ingest[bot]@users.noreply.github.com'
          # Build a fresh single-commit snapshot from a clean index. -f overrides .gitignore,
          # which excludes this path on main. Starting from an orphan means the commit has no
          # parent, so the branch history stays at exactly one commit.
          git checkout --orphan data-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f frontend/public/data/specs
          git commit -q -m 'chore: refresh parse samples'
          NEW_TREE=$(git rev-parse HEAD^{tree})
          # Skip the force-push when the tree is byte-identical to the current data tip, so
          # quiet hours produce no new commit and no needless deploy.
          OLD_TREE=$(git rev-parse --verify --quiet origin/data^{tree} || true)
          if [ "$NEW_TREE" = "$OLD_TREE" ]; then
            echo "Data unchanged; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force origin HEAD:data
          echo "changed=true" >> "$GITHUB_OUTPUT"
