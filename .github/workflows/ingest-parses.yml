name: Ingest Parse Samples

on:
  # Hourly scheduling is driven by an EXTERNAL scheduler (cron-job.org) that calls the
  # workflow_dispatch REST API once an hour. GitHub's own schedule: cron was removed - it
  # dropped most fires under load (3 fires in 7 hours observed) and ignores the set minute.
  workflow_dispatch:

# Shared with deploy-pages and pr-preview - see the note there. This job owns the data/ tree
# on gh-pages; serializing all gh-pages writers keeps their single-commit force-pushes from
# reverting each other's folder.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          # Full history: the orchestrator orders specs by the git last-commit time of each
          # spec's data dir (git-mtime.ts). A shallow clone collapses every path's git log to
          # one commit, which would make all specs tie.
          fetch-depth: 0

      # The generated bench data is NOT tracked on main - it lives once at the gh-pages root
      # under data/specs/ (this workflow is its only writer). Overlay that copy into the working
      # tree BEFORE scrape/ingest so the orchestrator's signature-skip has the current data on
      # disk to compare against. Untracked worktree only, so the paths stay ignored on main. On
      # the very first run gh-pages has no data yet, so the archive is a no-op and ingest starts
      # from empty.
      - name: Overlay bench data from gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          rm -rf frontend/public/data/specs
          git archive origin/gh-pages data/specs 2>/dev/null | tar -x -C frontend/public || \
            echo "No existing data on gh-pages; starting from empty."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Re-scrape every existing guide first so guides.json stays fresh on the same cadence.
      # Per-guide errors are recorded, not fatal. YouTube transcripts go through the Supadata
      # API (SUPADATA_API_KEY secret); already-scraped YouTube guides are skipped, so the
      # metered API is only hit once per new/errored video. Web/SimC need no secret.
      - name: Refresh guide content
        working-directory: frontend
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: npm run scrape

      # Ingestion self-selects the current live raids from WCL (current expansion,
      # non-frozen zones confirmed live by a rankings probe) and self-prunes data for
      # encounters that are no longer current. No manual per-patch edits needed.
      - name: Run parse ingestion
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        working-directory: frontend
        run: npm run ingest

      # Publish the fresh (minified) data into the data/specs/ folder at the gh-pages root.
      # clean:true is scoped to the target-folder, so it replaces data/specs/ only and never
      # touches main/ or the pr-* previews. The action commits nothing when the tree is byte-identical,
      # so quiet hours produce no push and no needless redeploy. The site reads this copy
      # directly (no rebuild needed), so publishing the data IS the deploy.
      - name: Publish data to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: frontend/public/data/specs
          target-folder: data/specs
          clean: true
