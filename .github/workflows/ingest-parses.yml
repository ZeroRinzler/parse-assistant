name: Ingest Parse Samples

on:
  schedule:
    # Runs every hour. Each run ingests only the 1-2 specs assigned to that UTC
    # hour (static shard), so the ~38-spec roster refreshes once every 24h while
    # staying well within the WCL free-tier 3,600 points/hour budget.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run parse ingestion
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: node frontend/scripts/ingest.mjs

      - name: Pull latest before committing
        env:
          BRANCH: ${{ github.ref_name }}
        # --autostash so the ingest's unstaged spec-file changes don't block the
        # rebase ("cannot pull with rebase: You have unstaged changes"); they are
        # stashed, the rebase runs, then they are reapplied for the commit step.
        run: git pull --rebase --autostash origin "$BRANCH"

      - name: Commit updated spec files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # No [skip ci] - data commits should trigger deploy-pages so the live
          # site reflects fresh parse data. git-auto-commit-action only pushes
          # when files actually changed, so quiet hours produce no commit.
          commit_message: 'chore: refresh parse samples'
          file_pattern: 'frontend/public/data/specs/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
