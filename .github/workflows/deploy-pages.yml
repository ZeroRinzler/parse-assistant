name: Deploy to GitHub Pages

on:
  push:
    # `data` is the always-squashed branch holding the generated bench data (see A3 /
    # ingest-parses.yml). A fresh data snapshot must redeploy the site, so both branches
    # trigger this build. The checkout below always pins the CODE to `main` and overlays the
    # latest `data` snapshot, so the trigger branch does not change what gets built.
    branches: [main, data]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Always build the CODE from main, regardless of which branch triggered this run
          # (main code push or a data-branch snapshot push).
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # The bench data is not tracked on main; overlay the latest `data`-branch snapshot into
      # the working tree so the built site ships the parse data. --worktree only, never staged.
      - name: Overlay bench data from the data branch
        run: |
          git fetch origin data
          git restore --source=origin/data --worktree -- frontend/public/data/specs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --base-href /warcraft-learner/
        working-directory: frontend

      - name: Copy 404 fallback for SPA routing
        run: cp static/angular/browser/index.html static/angular/browser/404.html

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          # Keep gh-pages at exactly one commit: each deploy snapshots the branch tree
          # (prod site + pr-* previews per the clean rules) instead of growing history
          # with a full ~400 MB built-site copy per deployment.
          single-commit: true
          folder: static/angular/browser
          clean: true
          clean-exclude: |
            pr-*
