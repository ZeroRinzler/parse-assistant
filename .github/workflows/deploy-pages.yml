name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# GITHUB_TOKEN scopes for the github-script steps only; the gh-pages push authenticates
# with the app token persisted by the checkout, so the default token needs no repo write.
permissions:
  contents: read
  pull-requests: read
  deployments: write

# Shared with ingest-parses (the data/ tree): every gh-pages writer force-pushes a single
# squashed commit built from a start-of-job checkout, so concurrent writers would revert
# each other's folders. cancel-in-progress: false serializes them instead.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  # Builds the shell + every open PR preview. Runs untrusted PR head code (npm ci lifecycle
  # scripts + the PR's own build config), so it holds NO write credential: no app token, and
  # persist-credentials:false keeps even the read-only GITHUB_TOKEN out of .git/config. A
  # compromised PR build therefore has nothing to steal and cannot push anywhere. The built
  # static output is handed to the publish job as artifacts.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # The gh-pages root slices this run owns: push -> the prod shell (main/ plus the root
    # index.html and 404.html), pull_request -> the pr-* previews, dispatch -> both (full
    # resync). data/ (owned by ingest-parses) and CNAME ride along untouched.
    env:
      BUILD_SHELL: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      BUILD_PREVIEWS: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    outputs:
      open_prs: ${{ steps.open-prs.outputs.numbers }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ships the shell only: the site reads the one shared data/specs/ copy at the
      # gh-pages root via the absolute dataBaseHref, and the custom-domain root (gh-pages
      # CNAME) keeps the base-href free of a repo-name segment.
      # Built FIRST, staged into the untracked shell-out/: the preview loop below rewrites
      # the tracked worktree, including .github/pages-root/index.html.
      - name: Build main shell
        if: env.BUILD_SHELL == 'true'
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build -- --base-href "/main/"
          rm -rf shell-out
          mkdir -p shell-out/main
          cp -a static/angular/browser/. shell-out/main/
          cp .github/pages-root/index.html shell-out/index.html
          # Pages serves 404.html site-wide, booting the SPA for deep links under /main/.
          cp static/angular/browser/index.html shell-out/404.html

      # The previews that should exist are exactly the OPEN base:main PRs: each run
      # rebuilds all of them and replaces the pr-* dirs wholesale, so a closed PR's preview
      # vanishes by not being rebuilt (PRs against other branches have no buildable app).
      - name: List open PR numbers
        id: open-prs
        if: env.BUILD_PREVIEWS == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            const numbers = prs.map((pr) => pr.number);
            core.info(`Open PRs (base main): ${numbers.join(', ') || '(none)'}`);
            core.setOutput('numbers', numbers.join(' '));

      # A preview that fails to build is skipped with a warning, so one bad PR never blocks
      # the reap of the others. pull/N/head is UNTRUSTED contributor code; this job holds no
      # write credential, so the npm ci / build it runs cannot reach a token or push.
      - name: Build all open PR previews
        if: env.BUILD_PREVIEWS == 'true'
        env:
          OPEN_PRS: ${{ steps.open-prs.outputs.numbers }}
        run: |
          set -uo pipefail
          rm -rf preview-out
          mkdir -p preview-out
          for n in $OPEN_PRS; do
            echo "::group::Build preview for PR #$n"
            if git fetch --no-tags --quiet origin "pull/$n/head" \
              && git checkout --quiet --detach FETCH_HEAD \
              && npm --prefix frontend ci \
              && npm --prefix frontend run build -- --base-href "/pr-$n/"; then
              rm -rf "preview-out/pr-$n"
              mkdir -p "preview-out/pr-$n"
              cp -a static/angular/browser/. "preview-out/pr-$n/"
            else
              echo "::warning::Preview build failed for PR #$n; it gets no preview this run."
            fi
            echo "::endgroup::"
          done

      - name: Upload shell artifact
        if: env.BUILD_SHELL == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-out
          path: shell-out
          include-hidden-files: true
          retention-days: 1

      - name: Upload previews artifact
        if: env.BUILD_PREVIEWS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-out
          path: preview-out
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Composes gh-pages from the already-built artifacts and force-pushes. Runs NO PR-authored
  # code - only trusted git plumbing over static files - so it is the only job that holds the
  # write-scoped app token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      BUILD_SHELL: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      BUILD_PREVIEWS: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
      OPEN_PRS: ${{ needs.build.outputs.open_prs }}

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      # The persisted app token authenticates the gh-pages force-push below. Safe here
      # because this job never checks out or runs PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Download shell artifact
        if: env.BUILD_SHELL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shell-out
          path: shell-out

      - name: Download previews artifact
        if: env.BUILD_PREVIEWS == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-out
          path: preview-out

      # Compose gh-pages in a scratch worktree: replace only the slices this run owns and
      # force-push one flat commit; everything unowned rides along from origin/gh-pages.
      # A byte-identical tree pushes nothing, so no-op runs cause no Pages redeploy.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin gh-pages
          rm -rf ghp
          git worktree add --detach ghp origin/gh-pages
          (
            cd ghp
            if [ "$BUILD_SHELL" = "true" ]; then
              rm -rf main index.html 404.html
              cp -a ../shell-out/. .
            fi
            if [ "$BUILD_PREVIEWS" = "true" ]; then
              # Remove any existing previews/ wrapper dir along with the per-PR dirs.
              rm -rf pr-* previews
              if compgen -G "../preview-out/pr-*" > /dev/null; then
                cp -a ../preview-out/pr-* .
              fi
            fi
            git checkout --quiet --orphan _deploy
            git add -A
            NEW_TREE=$(git write-tree)
            OLD_TREE=$(git rev-parse origin/gh-pages^{tree})
            if [ "$NEW_TREE" = "$OLD_TREE" ]; then
              echo "gh-pages already up to date; nothing to publish."
            else
              parts=""
              if [ "$BUILD_SHELL" = "true" ]; then
                parts="main shell"
              fi
              if [ "$BUILD_PREVIEWS" = "true" ]; then
                parts="${parts:+$parts + }PR previews: ${OPEN_PRS:-(none)}"
              fi
              git -c user.name="github-actions[bot]" \
                  -c user.email="github-actions[bot]@users.noreply.github.com" \
                  commit --quiet -m "Publish $parts"
              git push --force origin _deploy:gh-pages
            fi
          )
          git worktree remove --force ghp

      # Keeps the per-PR "View deployment" link in sync: live on open/update, inactive on
      # close. Only pull_request events carry a single PR.
      - name: Update deployment status for the triggering PR
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const environment = `pr-preview-${pr}`;
            if (context.payload.action === 'closed') {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment,
              });
              for (const deployment of deployments) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                });
              }
              return;
            }
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment,
              description: `Preview for PR #${pr}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${pr}/`,
              description: 'Preview ready',
            });
