name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# All three gh-pages writers - this workflow (main shell), pr-preview (preview shells) and
# ingest-parses (the data/ tree) - share ONE concurrency group. Each writes a disjoint folder
# (main/, pr-*, data/), but every deploy force-pushes a single squashed commit built from
# a start-of-job checkout of gh-pages, so two concurrent writers would revert each other's
# folder. Serializing them (cancel-in-progress: false) keeps the branch consistent.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # The site is composed on gh-pages, not baked whole here: this build ships ONLY the app
      # shell (no data overlay). The ~100 MB minified data lives once at the gh-pages root under
      # data/specs/ (maintained solely by ingest-parses) and every environment fetches that one
      # shared copy via the absolute dataBaseHref, so `main` never re-pushes the dataset.
      # The site is served from the custom domain root (see the gh-pages `CNAME` file), so the
      # base-href carries no repo-name segment - just the environment folder, matching the
      # frontend `dataBaseHref` root.
      - name: Build
        run: npm run build -- --base-href "/main/"
        working-directory: frontend

      # Root of the site: a 3-line index.html that redirects to the `main` environment, plus a
      # 404.html copy of the built shell so GitHub Pages' site-wide 404 boots the SPA for deep
      # links under /main/ (client-side routes survive a hard refresh).
      - name: Assemble root overlay
        run: |
          set -euo pipefail
          mkdir -p root-overlay
          cp .github/pages-root/index.html root-overlay/index.html
          cp static/angular/browser/index.html root-overlay/404.html

      # Publish the shell into its own environment folder. clean:true is scoped to the
      # target-folder, so it replaces `main/` only and never touches data/ or the pr-* previews.
      - name: Deploy main shell
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: static/angular/browser
          target-folder: main
          clean: true

      # Publish the root index.html / 404.html. clean:false so it only adds/updates those two
      # files at the site root and leaves main/, data/ and the pr-* previews intact.
      - name: Deploy root redirect and 404 fallback
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: root-overlay
          clean: false
